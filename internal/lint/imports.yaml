# Reviewed imports of non-test code (P1 auth review round 11, primitives-r11-2 and -3; rule
# one-primitive-per-key, enforced by internal/lint TestEveryImportIsReviewed).
#
# Why this file exists. The RFC 6238 rule of spec 6.3 says a one-time code is verified in one place,
# internal/auth/totp, which throttles first and spends the matched step after. Two rounds closed holes in
# that rule by widening a list of NAMES (a path element called totp, hotp, otp or gotp), and a library
# called dgoogauth, twofactor or go-otp passed, as did HMAC-SHA1 built from hkdf.Extract(crypto.SHA1.New,
# ...). A block list fails open for every name nobody thought of, so the rule is an allow list that fails
# closed: a package outside the standard library and this module may be imported by non-test code only if it
# is listed here with the reason, in a diff a reviewer reads.
#
# Two lists, both compared with the source and go.mod in both directions:
#
#   code_primitives  the standard-library and x/crypto packages that can compute an HMAC or an HOTP
#                    (directly, or as HKDF-Extract or PBKDF2 over SHA-1), with the only package
#                    directories that may import each. Any other importer fails, and an entry whose
#                    package no longer imports it fails too, so the list cannot rot into a free pass.
#                    The directories of shared/ are judged as well (written "shared/identity"), and a
#                    Panel directory that imports a shared package is taken to import every primitive
#                    that package reaches, itself or through another shared package, so the module
#                    cannot carry a primitive past the list (round 12, primitives-r12-4).
#   third_party      every import path of non-test code outside the standard library and this module,
#                    the shared module included.
#                    Each path must lie under a direct requirement of go.mod, and each direct
#                    requirement must have a path here or be listed under without_non_test_import.
#
# A test file may import anything: the rule is about what a route can reach.

code_primitives:
  crypto/hmac:
    why: the MAC of the key ring subkeys, the HMAC an RFC 6238 code is made of, and shared/identity ProofCode (HMAC-SHA256 of a node label and a source address under the proof key of the DNS node, a 10 character TXT proof and no authenticator code), which internal/setup and internal/endpoints reach by importing identity for its grammar (ParseHost, ParseDoHPath, SlugClient, the Valid functions, NewResolverID, NewDoHToken, RIDHash, TokenHash) and never call
    only: [internal/keyring, internal/auth/totp, shared/identity, internal/setup, internal/endpoints, internal/compiler, internal/hub/hubtel]
  crypto/hkdf:
    why: the per-label subkeys of the key ring; hkdf.Extract(sha1.New, msg, key) is HMAC-SHA1(key, msg)
    only: [internal/keyring]
  crypto/sha1:
    why: the hash of an RFC 6238 code, the script digest EVALSHA takes in the rate limiter, and the UUIDv5 of a profile identifier in shared/appleprofile (RFC 9562 defines v5 as SHA-1 of a namespace and a name, with no key, so it is neither a MAC nor a code), which internal/mobileconfig reaches by importing it, and internal/endpoints by importing both (it makes the stored params of a download link and builds the profile)
    only: [internal/auth/totp, internal/ratelimit, shared/appleprofile, internal/mobileconfig, internal/endpoints]
  crypto/pbkdf2:
    why: PBKDF2 with one round over SHA-1 is an HMAC-SHA1 of the salt, so it is a way to compute a code
    only: []
  crypto:
    why: the bare package names the hash (crypto.SHA1.New) that the HKDF or PBKDF2 above is given
    only: []
  golang.org/x/crypto/hkdf:
    why: the same as crypto/hkdf, from the x/crypto module
    only: []
  golang.org/x/crypto/pbkdf2:
    why: the same as crypto/pbkdf2, from the x/crypto module
    only: []

third_party:
  - path: github.com/Kup1ng/CtrlZ-Shared/appleprofile
    why: request validation and the stable identifiers of the Apple DNS profile, shared with the node (SC 14); internal/mobileconfig builds the file from its params
  - path: github.com/Kup1ng/CtrlZ-Shared/blob
    why: the CZPB profile blob builder and the options merge, which the compiler (P4 6.2) writes profiles with so the node opens exactly what it built
  - path: github.com/Kup1ng/CtrlZ-Shared/enrollproof
    why: the Poll proof of possession of a node enrolment (the signed input and the canonical-DER check), shared with the node that signs it; internal/hub/hubenroll calls it
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/common/v1
    why: the enums and the prefix of the wire records the compiler writes
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/enroll/v1
    why: the Enrollment service messages the hub serves (internal/hub)
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/hub/v1
    why: the NodeHub service messages the hub serves (internal/hub)
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/policy/v1
    why: the config entry and its records, which the compiler writes and keeps a view of; the PairTable the node routes build to judge a change of membership (internal/nodeadmin)
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/sign/v1
    why: the signed Root and Manifest the install door of the hub reads (internal/hub/hubinstall), and the Snapshot message the compiler writes (P4 6, SC 12)
  - path: github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/telemetry/v1
    why: the activity and counters messages of the upload streams the hub serves (internal/hub, internal/hub/hubtel)
  - path: github.com/Kup1ng/CtrlZ-Shared/gtable
    why: the CZGT filter tables of a lab fixture (ctrlz catalog load-fixture, P4 6.3), built the way the importer of P6 will build them
  - path: google.golang.org/protobuf/encoding/protowire
    why: walks the top-level fields of a stored log entry for pair_table without decoding it, since one entry may hold 15 MiB (internal/nodeadmin)
  - path: github.com/Kup1ng/CtrlZ-Shared/identity
    why: the resolver grammar (ParseHost, ParseDoHPath, the Valid functions and SlugClient) that internal/setup builds hostnames, URLs and client labels by, so a value it hands a user reads back on the node as the same Endpoint and client; internal/hub/hubtel is the one other caller, which calls ProofCode with the proof key to derive the hash of the TXT code of a UDP proof (SC 3.5, p4-nodes 5.4), and no authenticator code
  - path: github.com/Kup1ng/CtrlZ-Shared/locations
    why: AllowedLocations, EffectiveService and EffectiveSelection, the one definition of which locations a profile may use (P2 write path and locations route)
  - path: github.com/Kup1ng/CtrlZ-Shared/manifest
    why: the signature check of a bundle manifest before it is parsed, and the bundle path rules (internal/hub/hubinstall)
  - path: github.com/Kup1ng/CtrlZ-Shared/names
    why: the canonical form of a domain and of a typed host name (names.ParseUser), the one every rule, profile domain and Target host goes through
  - path: github.com/Kup1ng/CtrlZ-Shared/netclass
    why: the one constant the ctrlz_lab tag sets (AllowPrivatePairAddrs), which tells the load-fixture command whether this is a lab build; the address class of a node's advertised address (internal/nodeadmin)
  - path: github.com/Kup1ng/CtrlZ-Shared/noredirect
    why: the one definition of an Iranian name (D42), shared with the evaluator
  - path: github.com/Kup1ng/CtrlZ-Shared/rules
    why: rules.Parse and MergeUpload, the one validator of a rule token
  - path: github.com/Kup1ng/CtrlZ-Shared/schedule
    why: the weekly grid (Cells) and the cell of an instant in a zone, which the lock-password check of internal/endpoints evaluates the stack that applies by
  - path: github.com/Kup1ng/CtrlZ-Shared/wire
    why: the validators and the hash chain of the entries the compiler writes, the one judge the node uses too; ValidatePairTable and ZoneInput in internal/nodeadmin
  - path: github.com/Kup1ng/CtrlZ-Shared/zone
    why: zone.Build, run on every PairTable the compiler is about to write (SC 8a.4, Valid table); the other judge of a PairTable in internal/nodeadmin
  - path: github.com/ccojocar/zxcvbn-go
    why: password strength score (4.2)
  - path: github.com/ccojocar/zxcvbn-go/match
    why: the match type of the same scorer
  - path: github.com/fxamacker/cbor/v2
    why: CBOR of the passkey test authenticator (internal/auth/passkey/passkeytest)
  - path: github.com/getkin/kin-openapi/openapi3
    why: the OpenAPI document the request boundary validates against
  - path: github.com/getkin/kin-openapi/openapi3filter
    why: request validation against that document
  - path: github.com/getkin/kin-openapi/routers
    why: route lookup for that validation
  - path: github.com/go-chi/chi/v5
    why: the HTTP router
  - path: github.com/go-webauthn/webauthn/protocol
    why: passkey ceremonies (6.4)
  - path: github.com/go-webauthn/webauthn/webauthn
    why: passkey ceremonies (6.4)
  - path: github.com/google/uuid
    why: identifiers
  - path: github.com/jackc/pgx/v5
    why: the Postgres driver, imported only where the store rule allows
  - path: github.com/jackc/pgx/v5/pgconn
    why: Postgres errors, for the SQLSTATE class
  - path: github.com/jackc/pgx/v5/pgtype
    why: Postgres types in the store
  - path: github.com/jackc/pgx/v5/pgxpool
    why: the connection pools of the store
  - path: github.com/jackc/pgx/v5/stdlib
    why: database/sql adapter of the migration runner
  - path: github.com/moby/moby/api/types/container
    why: container types of the test harness (testpg, testvalkey)
  - path: github.com/moby/moby/api/types/network
    why: network types of the test harness
  - path: github.com/oapi-codegen/runtime
    why: runtime of the generated API code
  - path: github.com/oapi-codegen/runtime/types
    why: types of the generated API code
  - path: github.com/pressly/goose/v3
    why: migrations
  - path: github.com/pressly/goose/v3/lock
    why: the migration lock
  - path: github.com/riverqueue/river
    why: the queue of the batch jobs of P2 (spec 3.5), run poll-only by the worker
  - path: github.com/riverqueue/river/riverdriver
    why: the executor and driver interfaces River's executors are wrapped over (internal/riverpoll)
  - path: github.com/riverqueue/river/riverdriver/riverpgxv5
    why: River's driver over the pool of the worker role, built in the store and nowhere else
  - path: github.com/riverqueue/river/rivertype
    why: the states of a River job, for the sweep that asks whether a live job holds a row
  - path: github.com/santhosh-tekuri/jsonschema/v6
    why: JSON schema checks of the request boundary
  - path: github.com/testcontainers/testcontainers-go
    why: containers of the shared test harness (internal/testpg, internal/testvalkey)
  - path: github.com/testcontainers/testcontainers-go/exec
    why: running the scripts of deploy/compose/postgres (the watchdog) inside the Postgres container of the test harness
  - path: github.com/testcontainers/testcontainers-go/modules/postgres
    why: the Postgres container of the test harness
  - path: github.com/testcontainers/testcontainers-go/wait
    why: wait strategies of the test harness
  - path: github.com/valkey-io/valkey-go
    why: the rate limiter and the counters in Valkey
  - path: golang.org/x/crypto/argon2
    why: password hashing (4.1)
  - path: golang.org/x/crypto/x509roots/fallback/bundle
    why: the Mozilla root certificates embedded in the binary, the "public certificate" test of an uploaded chain (internal/certcheck, p4-nodes 4.3)
  - path: golang.org/x/image/webp
    why: "the WebP decoder of assets.Store (P4b 10.5). A logo of that type is read once, its header first, and written again as PNG, so no WebP and no metadata is stored"
  - path: golang.org/x/net/dns/dnsmessage
    why: the wire message of the DDNS job's DoH lookups (P4 8), the same package the Go resolver is built on
  - path: golang.org/x/net/publicsuffix
    why: the cookie domain check of the admin API, and the public suffix rule of a dns_zone (internal/nodeadmin, p4-nodes 9.4)
  - path: golang.org/x/sync/semaphore
    why: the first-in-first-out weighted work pool of the heavy operations (internal/admission, spec 6.5), whose large waiter is not passed by small ones that arrive later
  - path: golang.org/x/text/unicode/norm
    why: NFKC of passwords, phone numbers and OTP codes
  - path: google.golang.org/grpc
    why: the Enrollment and NodeHub servers of the hub, served over http.Server.ServeHTTP on the node port (internal/hub)
  - path: google.golang.org/grpc/codes
    why: status codes of those servers
  - path: google.golang.org/grpc/status
    why: status errors of those servers
  - path: google.golang.org/protobuf/encoding/protojson
    why: reading root.json and the bundle manifests, which are protojson (internal/hub/hubinstall)
  - path: google.golang.org/protobuf/proto
    why: proto.Equal, Marshal and Unmarshal of the records and snapshots of the compiler (P4 6); the PairTable of a stored log entry and of the hub's last event, to refuse the removal of a node a table still pairs (internal/nodeadmin)
  - path: google.golang.org/protobuf/proto
    why: the wire size of a message a handler took out of a NodeHub stream, to give its bytes back to the unread budget of the body (internal/hub/hubnet)
  - path: gopkg.in/yaml.v3
    why: the OpenAPI, mutant and registry files that the checkers read
