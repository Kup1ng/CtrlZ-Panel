        tests: [TestValkeyMaintenanceKillsAScriptThatHoldsTheServer]
  - id: service-credential-cannot-hold-valkey-script-takes-any-key-count
    rule: service-credential-cannot-hold-valkey
    finding: admin-r14-4
    docker: true
    why: take.lua loops over as many keys as the caller sends again, so a holder of a service credential keeps Valkey busy with EVALSHA alone, and from the write phase on SCRIPT KILL cannot stop it.
    edits:
      - file: internal/ratelimit/lua/take.lua
        old: |-
          if k > MAX_SLOTS + 1 then return redis.error_reply('ERR limiter: too many keys') end
        new: |-
          local unused = 0
      - file: internal/ratelimit/lua/take.lua
        old: |-
          if n < 1 or n > MAX_SLOTS then return redis.error_reply('ERR limiter: no slot or too many') end
        new: |-
          if n < 1 then return redis.error_reply('ERR limiter: no slot') end
    must_fail:
      - pkg: ./internal/ratelimit
        tests: [TestValkeyScriptsRefuseACallTheLimiterWouldNeverSend]
  - id: service-credential-cannot-hold-valkey-maintain-judges-kill-by-exit-status
    rule: service-credential-cannot-hold-valkey
    finding: admin-r14-5
    docker: true
    why: The loop shuts the server down only when valkey-cli fails, and valkey-cli exits 0 on UNKILLABLE, so a script that has written holds every command BUSY until it ends by itself.
    edits:
      - file: deploy/compose/valkey/maintain.sh
        old: |-
          *UNKILLABLE*)
        new: |-
          *NEVERANSWERED*)
    must_fail:
      - pkg: ./internal/lint
        tests: [TestValkeyMaintenanceRestartsAServerThatHoldsAScriptThatHasWritten]
  - id: service-credential-cannot-hold-valkey-maintain-judges-load-by-exit-status
    rule: service-credential-cannot-hold-valkey
    finding: admin-r14-1
    docker: true
    why: The loop takes a SCRIPT LOAD that the server answered with an error for a load that worked, so the marker is written and the container goes healthy with a script unknown.
    edits:
      - file: deploy/compose/valkey/maintain.sh
        old: |-
          *[!0-9a-f]*) ok=0; bad="$bad ${f##*/}" ;;
        new: |-
          *[!0-9a-f]*) ;;
    must_fail:
      - pkg: ./internal/lint
        tests: [TestValkeyMaintenanceDoesNotCallBrokenScriptsLoaded]
  - id: service-credential-cannot-hold-valkey-maintain-decides-on-an-exit-status
    rule: service-credential-cannot-hold-valkey
    finding: admin-r14-1
    why: The kill step goes back to a decision on the exit status of valkey-cli, which is 0 for every reply.
    edits:
      - file: deploy/compose/valkey/maintain.sh
        old: |-
          r=$(cli script kill 2>&1)
        new: |-
          cli script kill >/dev/null 2>&1 || cli shutdown nosave >/dev/null 2>&1
    must_fail:
