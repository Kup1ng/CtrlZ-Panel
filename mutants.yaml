  - id: service-credential-cannot-hold-valkey-sweep-does-nothing
    rule: service-credential-cannot-hold-valkey
    finding: admin-r15-1
    docker: true
    why: The keyspace sweep returns at once, so the junk a service credential writes with HSET (large values, no lifetime) stays and fills the instance, as it did before round 15.
    edits:
      - file: deploy/compose/valkey/sweep.lua
        old: |-
          local cursor = ARGV[1]
        new: |-
          if true then return '0 0 0 0' end
          local cursor = ARGV[1]
    must_fail:
      - pkg: ./internal/lint
        tests: [TestValkeyServiceCredentialCannotFillTheServer]
  - id: service-credential-cannot-hold-valkey-sweep-keeps-a-key-with-no-lifetime
    rule: service-credential-cannot-hold-valkey
    finding: admin-r15-4
    docker: true
    why: The sweep stops treating a key with no lifetime as foreign, but a limiter script always sets one, so tiny TTL-less keys written directly stay for ever and survive every restart in the append-only file.
    edits:
      - file: deploy/compose/valkey/sweep.lua
        old: |-
          if not bad and (ttl == -1 or ttl > MAX_TTL_MS) then bad = true end
        new: |-
          if not bad and (ttl > MAX_TTL_MS and ttl ~= -1) then bad = true end
    must_fail:
      - pkg: ./internal/lint
        tests: [TestValkeyServiceCredentialCannotFillTheServer]
  - id: service-credential-cannot-hold-valkey-sweep-has-no-key-budget
    rule: service-credential-cannot-hold-valkey
    finding: admin-r15-1
    docker: true
    why: The per-service key budget is not enforced, so a flood of keys shaped like the limiter's (a two field hash with an allowed lifetime) fills the instance and nothing removes it.
    edits:
      - file: deploy/compose/valkey/sweep.lua
        old: |-
          if api > MAX_KEYS then bad = true end
        new: |-
          if api > MAX_KEYS then bad = false end
    must_fail:
      - pkg: ./internal/lint
        tests: [TestValkeySweepKeepsEachServiceInsideItsKeyBudget]
  - id: exposure-is-declared-go-services-have-docker-default-grace
    rule: exposure-is-declared
    finding: admin-r15-2
    why: The Go services lose their stop_grace_period, so Docker kills them 10 s after SIGTERM, in the middle of the shutdown drain that needs up to twice the shutdown budget.
    edits:
      - file: deploy/compose/docker-compose.yml
        old: |-
          stop_grace_period: 45s
        new: |-
          stop_grace_period: 10s
    must_fail:
