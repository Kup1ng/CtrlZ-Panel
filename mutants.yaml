    why: ctrlz declare-lost lists a seed that opens with the key ring as lost because it names the number, which is the whole-number clear of round 4 again. After a total loss the regenerated key reuses the number, and a user who enrolled after the recovery loses a working authenticator to the declaration for the old seeds.
