  - id: caps-and-endings-record-of-an-accepted-send-has-a-short-deadline
    rule: caps-and-endings
    docker: true
    why: The record of an accepted send gets the 3 second shutdown budget while the worker runs, shorter than the lock_timeout of the database, so a busy global counter row loses the accept and the code is sent again.
    edits:
      - file: internal/worker/smssend/worker.go
        old: |-
          rctx, cancel := context.WithTimeout(context.WithoutCancel(ctx), recordBudget)
        new: |-
          rctx, cancel := context.WithTimeout(context.WithoutCancel(ctx), shutdownRecordBudget)
    must_fail:
