  - id: one-primitive-per-key-an-aad-function-hands-its-row-to-a-helper-that-drops-it
    rule: one-primitive-per-key
    finding: primitives-r15-2
    why: "An AAD function returns the result of a helper that ignores the row it is given, so every row is sealed under one context. The lint refuses any body that is not a call of keyring.RowContext or keyring.DigestContext."
    edits:
      - file: internal/auth/totp/aad.go
        old: |-
          func AdminAAD(admin uuid.UUID) keyring.Context { return keyring.RowContext([]uuid.UUID{admin}) }
        new: |-
          func AdminAAD(admin uuid.UUID) keyring.Context { return rowless(admin) }
          
          func rowless(uuid.UUID) keyring.Context {
          	return keyring.RowContext([]uuid.UUID{uuid.MustParse("0b6c1d1e-6c1f-4a52-9d6c-3f3c0f4f9a11")})
          }
    must_fail:
      - pkg: ./internal/lint
        tests: [TestEverySealBindsAnAADFunction]

