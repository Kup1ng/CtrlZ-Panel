  # ---- P1 auth review, round 7, HTTP spine and tenant API ----
  - id: budget-keying-register-charges-the-code-check-before-the-invite
    rule: budget-keying
    finding: tenant-r7-1
    docker: true
    why: register counts otp_verify_net before it looks at the invite again, so thirty junk tokens from one /24 refuse every honest invitee behind it for the window.
    edits:
