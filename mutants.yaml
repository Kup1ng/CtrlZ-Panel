  # Round 12, database area.
  - id: caps-and-endings-spend-check-allows-nan
    rule: caps-and-endings
    finding: db-r12-1
    docker: true
    why: The CHECK on sms_counters.cost keeps only ">= 0", which NaN passes, so with the guard replaced or off a NaN spend parks the day's cap at reached and no UPDATE can lower it.
    edits:
      - file: migrations/postgres/0044_review_round12_db.sql
        old: |-
          CHECK (cost <> 'NaN'::numeric);
        new: |-
          CHECK (cost >= 0);
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestNaNIsRefusedInTheSpendAndInTheCapForEveryWriter, TestNaNCheckCanFail]
  - id: caps-and-endings-cap-check-allows-nan
    rule: caps-and-endings
    finding: db-r12-3
    docker: true
    why: The CHECK on system_settings.sms_cost_cap_daily keeps only ">= 0", so a NaN cap (never reached) is stored and the money cap silently stops stopping anything.
    edits:
      - file: migrations/postgres/0044_review_round12_db.sql
        old: |-
          CHECK (sms_cost_cap_daily <> 'NaN'::numeric);
        new: |-
          CHECK (sms_cost_cap_daily >= 0);
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestNaNIsRefusedInTheSpendAndInTheCapForEveryWriter, TestNaNCheckCanFail]
  - id: caps-and-endings-counter-guard-lets-nan-through
    rule: caps-and-endings
    finding: db-r12-1
    docker: true
    why: The guard of sms_counters stops refusing a NaN spend, so only the CHECK is left and a replaced trigger or a role that meets the guard first no longer gets the same refusal.
    edits:
      - file: migrations/postgres/0044_review_round12_db.sql
        old: |-
          IF TG_OP IN ('INSERT', 'UPDATE') AND NEW.cost = 'NaN'::numeric THEN
        new: |-
          IF false THEN
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestNaNIsRefusedInTheSpendAndInTheCapForEveryWriter]
  - id: caps-and-endings-nan-cap-fails-open
    rule: caps-and-endings
    finding: db-r12-3
    docker: true
    why: cap_reached goes back to comparing only the spend, so a NaN cap is never reached and the money cap is silently off.
    edits:
      - file: migrations/postgres/0044_review_round12_db.sql
