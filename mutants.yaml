        tests: [TestSpecFactTables]
  - id: spec-fact-drift-a-test-the-spec-names-is-renamed
    rule: spec-fact-drift
    finding: sms-r7-2
    workspace: true
    why: A test the spec names in its numbered list or a finding's paragraph (not in the 18.7 table) is renamed in a fix commit. The spec still claims coverage and, before round 7, no check noticed, because the lint read the fact tables only.
    edits:
      - file: internal/store/catalogtest/auth_test.go
        old: |-
          func TestDeclareLostRunsAsKeytool(t *testing.T) {
        new: |-
          func TestDeclareLostRunsAsKeytoolRenamed(t *testing.T) {
    must_fail:
      - pkg: ./internal/lint
        tests: [TestSpecFactTables]
  - id: isolation-success-coverage-claim-release-without-tenant-predicate
    rule: isolation-success-coverage
    docker: true
    why: ip_claim_release stops filtering its lookup by tenant. The cross call (tenant B's setting with tenant A's claim id) must be refused and move nothing. The first mutant tried, dropping the predicate from the UPDATE of auth_phone_mark_verified, is equivalent - the SELECT above it already filters - and it survived, so it is not registered.
    edits:
      - file: migrations/postgres/0009_proof_and_claims.sql
        old: |-
          WHERE c.tenant_id = v_tenant AND c.id = p_claim_id
            FOR UPDATE;
            IF NOT FOUND OR v_state = 'released' THEN
        new: |-
          WHERE c.id = p_claim_id
            FOR UPDATE;
            IF NOT FOUND OR v_state = 'released' THEN
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestFunctionIsolation]

  # ---- the six findings of the round that named this rule ----------------------------
  - id: rfc6238-lint-ignores-an-aliased-import
    rule: tests-that-cannot-fail
    finding: primitives-r1-6, primitives-r1-13
    why: "The RFC 6238 lint stops following an aliased import of the totp package, so `t.Generate` outside the package gets past it."
    edits:
      - file: internal/lint/totp_test.go
        old: |-
          for _, local := range usableNames(names) {
          		for _, u := range totpUses(name, f, local) {
        new: |-
          for _, local := range []string{"totp"} {
          		for _, u := range totpUses(name, f, local) {
    must_fail:
      - pkg: ./internal/lint
        tests: [TestRFC6238RuleFires]
  - id: csrf-skipped-on-the-password-login-route
    rule: tests-that-cannot-fail
    finding: tenant-r1-9
    docker: true
    why: The CSRF layer is bypassed for one route. A test of one route elsewhere would not notice; the walk over every operation of the document does.
    edits:
      - file: internal/httpx/middleware.go
        old: |-
          return cop.Handler(inner)
        new: |-
          guarded := cop.Handler(inner)
          		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          			if strings.HasSuffix(r.URL.Path, "/auth/login/password") {
          				inner.ServeHTTP(w, r)
          				return
          			}
          			guarded.ServeHTTP(w, r)
          		})
