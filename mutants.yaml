  - id: caps-and-endings-accepted-send-recorded-on-the-worker-context
    rule: caps-and-endings
    docker: true
    why: An accepted send is recorded on the worker's own context, so a stop that arrives between the accept and the record transaction loses it and the next worker sends the code again.
    edits:
      - file: internal/worker/smssend/worker.go
        old: |-
