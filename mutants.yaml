    why: A router starts its own http listener, which is a second exposure of the health mux that no Compose or app check sees. The listener lint fails for any file not named in healthListenerFiles.
    edits:
      - file: internal/adminapi/server.go
        old: |-
          root.Handle("/*", health.Handler())
        new: |-
