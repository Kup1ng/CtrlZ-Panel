        tests: [TestValkeyUsersHoldOnlyDeclaredCommands, TestValkeyServicesCannotSubmitAScript]
  - id: exposure-is-declared-valkey-maintenance-does-not-end-a-script
    rule: exposure-is-declared
    finding: admin-r13-5
    docker: true
    why: The maintenance loop sees BUSY and does nothing, so a script that holds the server (of any origin) outlives the interval for ever.
    edits:
      - file: deploy/compose/valkey/maintain.sh
        old: |-
          r=$(cli script kill 2>&1)
        new: |-
          r=
    must_fail:
