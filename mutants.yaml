  - id: exposure-is-declared-credential-lint-needs-a-character-before-the-keyword
    rule: exposure-is-declared
    finding: admin-r15-5
    why: The environment lint judges only variables whose name holds AUTH, PASS, PASSWORD, SECRET or TOKEN again (the round 14 and 15 shape, a list of spellings), so PW=, MAINT=, API_KEY=, DBCRED= and a lower case export in a deploy script pass (admin-r16-5 rebuilt it as the shape of an environment, whatever the name).
    edits:
      - file: internal/lint/secretenv_test.go
        old: |-
          assignmentWord = regexp.MustCompile(`^[A-Za-z_][A-Za-z0-9_]*\+?=`)
