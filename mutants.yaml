  - id: caps-and-endings-send-outlasts-the-claim
    rule: caps-and-endings
    docker: true
    why: A send has no budget below the lease of its claim, so a slow snapshot reload and two slow calls can run past it and another worker claims the row that is still being sent.
    edits:
      - file: internal/worker/smssend/worker.go
        old: |-
          sctx, cancel := context.WithTimeout(ctx, budget)
        new: |-
          sctx, cancel := context.WithTimeout(ctx, 10*time.Minute)
    must_fail:
      - pkg: ./internal/worker/smssend
        tests: [TestASendThatHangsIsCutBeforeItsClaimLapses]
  - id: caps-and-endings-claim-lease-starts-with-the-transaction
    rule: caps-and-endings
    docker: true
    why: The claim lease is stamped with now(), the start of the claim transaction, so a wait on a counter row in the same transaction comes out of the send's time.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          SET delivery_claimed_until = clock_timestamp() + make_interval(secs => $3), delivery_attempts = o.delivery_attempts + 1
        new: |-
          SET delivery_claimed_until = now() + make_interval(secs => $3), delivery_attempts = o.delivery_attempts + 1
    must_fail:
