  - id: exposure-is-declared-a-listener-through-an-aliased-listenconfig
    rule: exposure-is-declared
    finding: admin-r13-2
    why: A router opens a socket through an aliased import and a ListenConfig value, which the round 12 list of call shapes (the identifier `net`, the names Listen and ListenTCP) did not see. The lint judges the callee by its package and its result type, so the spelling of the import changes nothing.
    edits:
      - file: internal/adminapi/server.go
        old: |-
          "net/netip"
        new: |-
          "net/netip"
          nn "net"
      - file: internal/adminapi/server.go
        old: |-
          root.Handle("/*", health.Handler())
        new: |-
          root.Handle("/*", health.Handler())
          go func() { var lc nn.ListenConfig; l, _ := lc.Listen(context.Background(), "tcp", ":7443"); _ = http.Serve(l, root) }()
    must_fail:
      - pkg: ./internal/lint
        tests: [TestHealthMuxHasOneExposureGate]
  - id: exposure-is-declared-the-api-may-eval-again
    rule: exposure-is-declared
    finding: admin-r13-5
    docker: true
    why: The api user gets EVAL back in the Valkey ACL, so one `EVAL "while true do end" 0` from a compromised api holds every command BUSY for every tenant until somebody restarts Valkey. The command list and the live ACL test both refuse it.
    edits:
      - file: deploy/compose/valkey/start.sh
        old: |-
          +evalsha +time +hmget +hset +pexpire\n' "$(tr -d
        new: |-
          +eval +evalsha +time +hmget +hset +pexpire\n' "$(tr -d
    must_fail:
