# Registered mutants (P1 auth review, round 5, rule tests-that-cannot-fail).
#
# A security test that has never been seen failing proves nothing. Each entry here is a
# small edit of the source that breaks what a rule of docs/reviews/p1-auth/rules.md
# protects, and the tests that must fail under it. `go run ./tools/mutants` (a step of
# scripts/ci.sh) applies each edit in a scratch copy of the tree and runs those tests:
#
#   - a test that passes under the edit            -> SURVIVED, CI fails
#   - an edit that does not apply (code moved)     -> INVALID, CI fails
#   - a tree that does not compile with the edit   -> INVALID, CI fails
#   - a test that already fails before the edit    -> INVALID, CI fails
#
# internal/lint TestEveryRuleHasAMutant fails for a rule of rules.md with no entry below,
# and TestMutantRegistry for an edit or a test name that no longer matches the tree.
#
# Format. `edits` are exact text replacements (old must occur once in the file, at its
# turn); a block scalar that starts on a non-blank character avoids fighting the
# indentation of the Go source. `docker: true` marks tests that start containers
# (`-short` skips them, as ci.sh -short skips the container tests); `workspace: true`
# marks tests that read the spec or rules.md of the workspace around this repository.
#
# Findings of the round with no mutant, and why: none now. admin-r1-11 (scripts/compose-net-test.sh
# needs a running Compose stack) is covered since round 5, admin-r5-12: internal/lint
# TestComposeNetTestNeighbourProbeCanFail runs the script against a stand-in docker.

# Rules whose enforcement is not written yet. An entry leaves this list in the commit
# that builds the rule; TestEveryRuleHasAMutant fails for a rule that is listed here and
# has an "As built" paragraph or a mutant below.
unbuilt: []

mutants:
  - id: lock-order-for-update-on-users
    rule: lock-order
    why: The user lock goes back to FOR UPDATE, which blocks the FOR KEY SHARE of every foreign key insert and is the root of the round 4 deadlocks.
    edits:
      - file: internal/store/locks.go
        old: |-
          FROM ctrlz.users WHERE tenant_id = $1 AND id = $2` + lockNoKeyUpdate
        new: |-
          FROM ctrlz.users WHERE tenant_id = $1 AND id = $2 FOR UPDATE`
    must_fail:
      - pkg: ./internal/lint
        tests: [TestLockOrderRule]
  - id: clock-source-application-time-from-the-database
    rule: clock-source
    why: The admin session's fresh-TOTP stamp is written from the database clock again, while the window is compared with the application clock.
    edits:
      - file: internal/store/admin_auth.go
        old: |-
          SET totp_verified_at = $2 WHERE id = $1 AND revoked_at IS NULL
        new: |-
          SET totp_verified_at = now() WHERE id = $1 AND revoked_at IS NULL
    must_fail:
      - pkg: ./internal/lint
        tests: [TestClockRule]
  - id: role-reach-worker-can-rewrite-a-guarded-column
    rule: role-reach
    docker: true
    why: A migration lets the worker role write enforce_passkey, a guarded column only a definer function may change.
    edits:
      - file: migrations/postgres/0020_role_reach.sql
        old: |-
          GRANT UPDATE (revoked_at) ON ctrlz.invites TO ctrlz_admin;
        new: |-
          GRANT UPDATE (revoked_at) ON ctrlz.invites TO ctrlz_admin;
          GRANT UPDATE (enforce_passkey) ON ctrlz.users TO ctrlz_worker;
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestCatalog, TestRoleGrantsGolden]
  - id: known-unknown-oracle-refund-gives-back-the-per-phone-keys
    rule: known-unknown-oracle
    why: The one refund statement also gives back the per-phone rows of the day, so a real row that ends unsent leaves lower per-phone counters than a decoy (the leak of rounds 3 to 6, whatever condition or list decides it). Since round 8 (sms-r8-3) the worker role cannot see a per-phone row at all, so the edit is a no-op at runtime and only the static test can see it; the database half of the rule has its own mutants (the row policy and the guard trigger, further down).
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          AND (k.key = 'all' OR k.key LIKE 'all:%') AND k.count > 0
        new: |-
          AND (k.key = 'all' OR k.key LIKE 'all:%' OR k.scope IN ('phone', 'phone_net')) AND k.count > 0
    must_fail:
      - pkg: ./internal/lint
        tests: [TestRefundIsTheGlobalKeyOnly]
  - id: known-unknown-oracle-new-store-method-refunds-a-phone
    rule: known-unknown-oracle
    why: A new ending adds its own statement that gives a phone's slot back. The first lint looked for the Go that builds a list of keys and missed an elided literal, a field assignment and a function value (sms-r6-1, sms-r6-5); this one reads the SQL, which every refund has to be.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          const qCountersAddCost = `INSERT INTO ctrlz.sms_counters AS c (day, scope, key, count, cost)
        new: |-
          const qRefundPhone = `UPDATE ctrlz.sms_counters SET count = count - 1 WHERE scope = 'phone' AND key = $1`

          const qCountersAddCost = `INSERT INTO ctrlz.sms_counters AS c (day, scope, key, count, cost)
    must_fail:
      - pkg: ./internal/lint
        tests: [TestRefundIsTheGlobalKeyOnly]
  - id: known-unknown-oracle-refund-statement-split-over-two-literals
    rule: known-unknown-oracle
    why: A new store statement gives a phone's slot back with the table name split over two literals. The lint of round 6 judged one literal at a time and read none of them as a write; this one folds the constants of the package first (sms-r7-7).
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          const qCountersAddCost = `INSERT INTO ctrlz.sms_counters AS c (day, scope, key, count, cost)
        new: |-
          const qRefundPhone = `UPDATE ctrlz.sms_` + `counters SET count = count - 1 WHERE scope = 'phone' AND key = $1`

          const qCountersAddCost = `INSERT INTO ctrlz.sms_counters AS c (day, scope, key, count, cost)
    must_fail:
      - pkg: ./internal/lint
        tests: [TestRefundIsTheGlobalKeyOnly]
  - id: known-unknown-oracle-migration-writes-the-counters-after-the-issue-function
    rule: known-unknown-oracle
    why: A statement placed after auth_otp_issue in the same migration was read as part of that function and allowed (sms-r7-6). A function is now read from its CREATE to the semicolon after its closing quote.
    edits:
      - file: migrations/postgres/src/0011_auth.sql
        old: |-
          REVOKE ALL ON FUNCTION ctrlz_fn.auth_otp_issue(text, text, bytea, bytea, inet, boolean) FROM PUBLIC;
        new: |-
          UPDATE ctrlz.sms_counters SET count = GREATEST(count - 1, 0) WHERE scope = 'phone';
          REVOKE ALL ON FUNCTION ctrlz_fn.auth_otp_issue(text, text, bytea, bytea, inet, boolean) FROM PUBLIC;
    must_fail:
      - pkg: ./internal/lint
        tests: [TestRefundIsTheGlobalKeyOnly]
  - id: known-unknown-oracle-database-lets-the-worker-write-a-phone-counter
    rule: known-unknown-oracle
    docker: true
    why: The trigger that judges the writes to sms_counters lets an UPDATE of a per-subject row through, so a per-phone refund written in a spelling no lint reads (a split name, a U& identifier, EXECUTE) works again and the 429 of spec 5.3 tells a phone with an account from one without (sms-r7-7, sms-r8-6).
    edits:
      - file: migrations/postgres/0044_review_round12_db.sql
        old: |-
          IF NEW.scope = OLD.scope AND NEW.key = OLD.key AND NEW.day = OLD.day AND NEW.count >= OLD.count THEN
        new: |-
          IF true THEN
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestNoRoleCanLowerMoveOrEarlyDeleteAPerSubjectCounter, TestADefinerFunctionOfTheAuthRoleCannotGiveAPhoneSlotBack]
  - id: role-reach-worker-reads-the-users-table
    rule: role-reach
    docker: true
    why: ctrlz_worker keeps the SELECT on users (id, locale, phone_e164, tenant_id) that P0 gave it and no statement of the worker uses, so a bug in the worker can list every tenant's phone numbers (sms-r7-4).
    edits:
      - file: migrations/postgres/0034_review_round7_sms.sql
        old: |-
          REVOKE SELECT (id, locale, phone_e164, tenant_id) ON ctrlz.users FROM ctrlz_worker;
        new: |-
          SELECT 1;
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestCatalog, TestRoleGrantsGolden, TestTheWorkerRoleCannotReadTheUsersTable]
  - id: known-unknown-oracle-a-failed-send-of-a-refused-number-opens-the-breaker
    rule: known-unknown-oracle
    docker: true
    why: A refused number counts toward the breaker, so a real row opens it and a decoy never does, on a state that is not a declared exception. The oracle harness compares the breakers and the public flag since sms-r6-4; before, it never looked.
    edits:
      - file: internal/sms/classify/decide.go
        old: |-
          case Gateway, Ambiguous:
        new: |-
          case Gateway, Ambiguous, Number:
    must_fail:
      - pkg: ./internal/api
        tests: [TestOracleRecipientRefused, TestOracleBlacklisted]
  - id: known-unknown-oracle-failed-login-row-written-inside-the-floor
    rule: known-unknown-oracle
    finding: tenant-r13-2
    docker: true
    why: The failed-login trail row is written inside the floored body again, so a wrong password for a phone with an account asks the pool a second time and an unknown phone does not (tenant-r13-2). The pool meter of the oracle compares the asks made before the answer, with no exception.
    edits:
      - file: internal/api/routes_login.go
        old: |-
          owed.Add(func(ctx context.Context) {
          				_ = s.d.Store.WithTenant(ctx, tenant, store.TxOpts{}, func(tx store.Tx) error {
          					return audit.Tenant(tx, user, ip, audit.LoginFailed{Method: audit.MethodPassword})
          				})
          			})
        new: |-
          func(ctx context.Context) {
          				_ = s.d.Store.WithTenant(ctx, tenant, store.TxOpts{}, func(tx store.Tx) error {
          					return audit.Tenant(tx, user, ip, audit.LoginFailed{Method: audit.MethodPassword})
          				})
          			}(ctx)
    must_fail:
      - pkg: ./internal/api
        tests: [TestOracleNone]
  - id: isolation-success-coverage-suspended-gate-allows-a-second-route
    rule: isolation-success-coverage
    finding: tenant-r13-1
    docker: true
    why: allowedWhileSuspended lets a second route through (a read here, a write in the next change), and no test suspended the tenant on every operation, so a suspended tenant's session reached it with every check green.
    edits:
      - file: internal/api/resolver.go
        old: |-
          return (op.Method == http.MethodGet && op.Path == "/me") || (op.Method == http.MethodPost && op.Path == "/auth/logout")
        new: |-
          return (op.Method == http.MethodGet && op.Path == "/me") || (op.Method == http.MethodPost && op.Path == "/auth/logout") || op.Path == "/account/limits"
    must_fail:
      - pkg: ./internal/api
        tests: [TestIsolation]
  - id: known-unknown-oracle-refused-number-keeps-the-global-key
    rule: known-unknown-oracle
    docker: true
    why: A refused number is not refunded at all, so the global counter moves for a real row that a decoy never touches.
    edits:
      - file: internal/worker/smssend/worker.go
        old: |-
          if !cleared.Yes() {
          		// The sweep (or a worker whose claim lapsed) already ended this row and
          		// gave its key back.
        new: |-
          if refused {
          		return false, nil
          	}
          	if !cleared.Yes() {
          		// The sweep (or a worker whose claim lapsed) already ended this row and
          		// gave its key back.
    must_fail:
      - pkg: ./internal/api
        tests: [TestOracleRecipientRefused]
      - pkg: ./internal/worker/smssend
        tests: [TestRecipientErrorStopsAndKeepsTheCaps]
  - id: credential-generation-compared-by-hand
    rule: credential-generation
    why: A credential field is compared with another credential value in the login service instead of moving the generation.
    edits:
      - file: internal/auth/login/login.go
        old: |-
          var device credgen.Stamp
          	err = s.DB.WithTenant(
        new: |-
          var device credgen.Stamp
          	_ = in.User.PasswordHash == in.User.PasswordHash
          	err = s.DB.WithTenant(
    must_fail:
      - pkg: ./internal/lint
        tests: [TestCredentialGenerationRule]
  - id: budget-keying-session-lookup-keyed-on-the-network
    rule: budget-keying
    why: The session lookup bucket of a proof class takes a network part again, so a stranger on the same network can fill it.
    edits:
      - file: internal/budget/budget.go
        old: |-
          Service: Tenant, Name: "session-lookup", Source: Proof, Parts: []Part{PartCookie}
        new: |-
          Service: Tenant, Name: "session-lookup", Source: Proof, Parts: []Part{PartCookie, PartNetwork}
    must_fail:
      - pkg: ./internal/budget
        tests: [TestRegistryRowsFollowTheKeySourceRule]
  - id: caps-and-endings-every-refusal-puts-the-hold
    rule: caps-and-endings
    finding: sms-r12-3
    docker: true
    why: The hold statement no longer refuses a gateway that is already held for the credentials, so every call in flight that met the refusal wins the hold and logs it, and the Won says nothing.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          AND held_ct_sum IS DISTINCT FROM $2
        new: |-
          AND true
    must_fail:
      - pkg: ./internal/store
        tests: [TestCapsRaceHarness]
  - id: caps-and-endings-outbox-finish-result-dropped
    rule: caps-and-endings
    why: The worker ends an outbox row and ignores whether it won the ending, so two actors can both raise the alert and refund.
    edits:
      - file: internal/worker/smssend/worker.go
        old: |-
          ending, err := g.OutboxFinish(it.ID, "failed", sms.StatusOf(reason))
          		if err != nil {
          			return err
          		}
          		if !ending.Yes() {
          			return nil // another actor ended it first; the alert is the ender's
          		}
        new: |-
          _, err := g.OutboxFinish(it.ID, "failed", sms.StatusOf(reason))
          		if err != nil {
          			return err
          		}
    must_fail:
      - pkg: ./internal/lint
        tests: [TestCapsAndEndingsRule]
  - id: proof-before-work-waived-password-change-skips-the-code-peek
    rule: proof-before-work
    finding: tenant-r9-2
    docker: true
    why: The waived password change stops looking at the second-factor code before the scoring and the hash, so a request with a code that cannot be right pays for both again.
    edits:
      - file: internal/api/routes_reauth.go
        old: |-
          return s.peekSecondFactor(tx, fc, p.UserID, deref(b.TotpCode), "")
        new: |-
          return nil
    must_fail:
      - pkg: ./internal/api
        tests: [TestAWaivedPasswordChangeLooksAtTheCodeBeforeTheHeavyWork]
  - id: proof-before-work-scoring-in-the-check-step
    rule: proof-before-work
    why: The register route scores and hashes the password in the Check step, before the code is proven, so a made-up request spends Argon2 and scoring.
    edits:
      - file: internal/api/routes_login.go
        old: |-
          return s.login.PeekRegisterCode(ctx, in)
        new: |-
          if _, err := s.preparePasswordOn(ctx, s.strengthAnon, deref(b.Password), in.Phone, "password"); err != nil {
          				return err
          			}
          			return s.login.PeekRegisterCode(ctx, in)
    must_fail:
      - pkg: ./internal/lint
        tests: [TestProofBeforeWorkRule]
  - id: boundary-input-passkey-name-without-maxlength
    rule: boundary-input
    why: A string of the passkey finish request loses its maxLength, so the document no longer bounds every input.
    edits:
      - file: api/openapi.yaml
        old: |-
          name: {type: string, maxLength: 64, pattern: *word}
                        code: {type
        new: |-
          name: {type: string, pattern: *word}
                        code: {type
    must_fail:
      - pkg: ./internal/lint
        tests: [TestOpenAPIBoundsEveryInput]
  - id: closed-values-in-logs-free-text-on-an-audit-event
    rule: closed-values-in-logs
    why: An audit event gains a free text field, which is how a value that is not closed reaches the audit trail.
    edits:
      - file: internal/auth/audit/audit.go
        old: |-
          LoginFailed struct {
          		Method Method `json:"method"`
        new: |-
          LoginFailed struct {
          		Method Method `json:"method"`
          		Note   string `json:"note"`
    must_fail:
      - pkg: ./internal/auth/audit
        tests: [TestEveryEventFieldIsClosed]
  - id: link-check-alphabet-admits-a-nonspacing-mark
    rule: link-check
    why: The template alphabet admits the Unicode category Mn again, which lets variation selectors and look-alikes through the link check.
    edits:
      - file: internal/sms/templates.go
        old: |-
          "unicode/utf8"
        new: |-
          "unicode"
          	"unicode/utf8"
      - file: internal/sms/templates.go
        old: |-
          return isPersianLetter(r) || strings.ContainsRune(punctuation, r)
        new: |-
          return isPersianLetter(r) || strings.ContainsRune(punctuation, r) || unicode.Is(unicode.Mn, r)
    must_fail:
      - pkg: ./internal/sms
        tests: [TestEveryCodePointOutsideTheAlphabetIsRefused]
  - id: admin-cli-secret-output-password-to-stdout
    rule: admin-cli-secret-output
    why: reset-password prints the one-time password to standard output as well as to the file.
    edits:
      - file: internal/admincli/accounts.go
        old: |-
          if err := out.write("one-time password", pw); err != nil {
        new: |-
          fmt.Fprintln(env.Stdout, pw.Reveal())
          		if err := out.write("one-time password", pw); err != nil {
    must_fail:
      - pkg: ./internal/lint
        tests: [TestAdminCLINeverWritesASecretOutsideAFile]
  - id: one-time-state-column-read-by-hand
    rule: one-time-state
    why: A route reads the must_reset field of its response again, a second copy of the one-time password state.
    edits:
      - file: internal/api/routes_account.go
        old: |-
          m.User.HasPassword, m.User.MustReset, m.User.LastLoginAt = hasPassword, u.State.OneTime(), u.LastLoginAt
        new: |-
          m.User.HasPassword, m.User.MustReset, m.User.LastLoginAt = hasPassword, u.State.OneTime(), u.LastLoginAt
          	_ = m.User.MustReset
    must_fail:
      - pkg: ./internal/lint
        tests: [TestOneTimeStateRule]
  - id: one-connection-per-request-ticket-put-on-the-outer-context
    rule: one-connection-per-request
    why: "A ticket is written through the pool from inside the login transaction, a second connection held while the first waits."
    edits:
      - file: internal/auth/login/login.go
        old: |-
          res = Result{} // the callback may run only once, but a result must never carry over
        new: |-
          res = Result{} // the callback may run only once, but a result must never carry over
          		_, _ = s.Tickets.Put(ctx, ticket.Issue{})
    must_fail:
      - pkg: ./internal/lint
        tests: [TestOneConnectionPerRequest]
  - id: cache-loader-hand-rolled-cache-in-the-router
    rule: cache-loader
    why: The SMS router grows a mutex and a timestamp of its own, a second hand-written cache beside the generic loader.
    edits:
      - file: internal/sms/router.go
        old: |-
          "errors"
          	"log/slog"
        new: |-
          "errors"
          	"log/slog"
          	"sync"
      - file: internal/sms/router.go
        old: |-
          type Router struct {
          	src         Source
        new: |-
          type Router struct {
          	mu          sync.Mutex
          	loaded      time.Time
          	src         Source
    must_fail:
      - pkg: ./internal/lint
        tests: [TestNoHandRolledCache]
  - id: bounded-sweeps-unbounded-delete
    rule: bounded-sweeps
    why: A worker statement deletes every matching row in one go, so a long outage turns the next sweep into one huge transaction.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          const OTPEndBatch = 200
        new: |-
          const OTPEndBatch = 200

          const qMutantSweep = `DELETE FROM ctrlz.sessions WHERE revoked_at < now() - interval '1 day'`

          func (g GlobalTx) mutantSweep() error {
          	_, err := g.tx.Exec(g.ctx, qMutantSweep)
          	return err
          }
    must_fail:
      - pkg: ./internal/lint
        tests: [TestBoundedSweeps]
  - id: sms-failure-classification-unreadable-credentials-are-a-message-problem
    rule: sms-failure-classification
    why: Unreadable credentials are classified as a problem of one message, so a gateway that cannot send at all still counts as available.
    edits:
      - file: internal/sms/classify/scope.go
        old: |-
          sms.CodeUnknownProvider, sms.CodeCredentialsUnreadable, sms.CodeUnusable:
        new: |-
          sms.CodeUnknownProvider, sms.CodeUnusable:
      - file: internal/sms/classify/scope.go
        old: |-
          sms.CodeCap, sms.CodeUnreadable, sms.CodeBadPayload:
        new: |-
          sms.CodeCap, sms.CodeUnreadable, sms.CodeBadPayload, sms.CodeCredentialsUnreadable:
    must_fail:
      - pkg: ./internal/sms/classify
        tests: [TestScopeOfTheFixedCodes, TestMatrix]
  - id: spec-fact-drift-device-marker-life-differs-from-the-spec
    rule: spec-fact-drift
    workspace: true
    why: The known-device marker lives 300 days in code while the spec table says 365, the drift the rule exists to catch.
    edits:
      - file: internal/keyring/labels.go
        old: |-
          LifeDevice = 365 * 24 * time.Hour
        new: |-
          LifeDevice = 300 * 24 * time.Hour
    must_fail:
