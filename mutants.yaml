  # The merge of the round 18 branches: tests that the coverage map of 18.7 names and that no mutant did.
  - id: goroutine-recover-keep-logs-a-panic-twice
    rule: goroutine-recover
    finding: sms-r18-14
    why: The guard every goroutine of the module starts with logs a kept panic twice, so the failed unit is counted twice by whatever watches the log; the three forms (a go statement, a timer, a context callback) each log it once.
    edits:
      - file: internal/safego/safego.go
        old: |-
          func Keep[K closed.Closed](log *slog.Logger, what K) {
          	if rec := recover(); rec != nil {
          		note(log, what, rec)
        new: |-
          func Keep[K closed.Closed](log *slog.Logger, what K) {
          	if rec := recover(); rec != nil {
          		note(log, what, rec)
          		note(log, what, rec)
    must_fail:
      - pkg: ./internal/safego
        tests: [TestGoCountsDownAUnitThatPanickedAndTheProcessLives, TestAfterAndOnDoneKeepThePanicOfTheirCallback]
  - id: goroutine-recover-a-panic-after-the-record-revives-an-outbox-row
    rule: goroutine-recover
    finding: sms-r18-17
    docker: true
    why: The retry-later statement puts the row back to pending whatever its state, so a message the provider accepted and the record marked sent, when a panic follows the commit, is sent again after its backoff.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          const qOutboxRetryLater = `UPDATE ctrlz.sms_outbox SET claimed_until = now() + make_interval(secs => $2)
          WHERE id = $1 AND state = 'pending'`
        new: |-
          const qOutboxRetryLater = `UPDATE ctrlz.sms_outbox SET state = 'pending', claimed_until = now() + make_interval(secs => $2)
          WHERE id = $1`
    must_fail:
      - pkg: ./internal/worker/smssend
        tests: [TestAPanicAfterTheRecordOfAnOutboxRowDoesNotReviveIt]
  - id: goroutine-recover-a-panic-inside-the-record-commits-what-it-wrote
    rule: goroutine-recover
    finding: sms-r18-17
    docker: true
    why: The transaction shell commits when the body panicked instead of rolling back, so the half of a record that was written before the panic (a breaker step, a delivery row) stays.
    edits:
      - file: internal/store/tx.go
        old: |-
          _ = tx.Rollback(rb)
        new: |-
          _ = tx.Commit(rb)
    must_fail:
      - pkg: ./internal/worker/smssend
        tests: [TestAPanicInsideTheRecordTransactionRollsItAllBack]
  - id: known-unknown-oracle-a-decoy-flood-queues-on-one-row-held-for-long
    rule: known-unknown-oracle
    finding: db-r18-2
    docker: true
    why: Every request counts on the one row 'all' again and holds it for a tenth of a second (the issue transaction does more than one short statement), so the flood of decoys queues past lock_timeout and refuses real requests with 503.
    edits:
      - file: migrations/postgres/0061_scoped_tenant_rows.sql
        old: |-
          v_gkey   := CASE WHEN pg_catalog.random() < 1.0 / 16 THEN 'all'
                             ELSE 'all:' || (1 + pg_catalog.floor(pg_catalog.random() * 15))::integer END;
        new: |-
          v_gkey   := 'all';
      - file: migrations/postgres/0061_scoped_tenant_rows.sql
        old: |-
          END LOOP;
          
              -- The cooldown reads challenges
        new: |-
          END LOOP;
              PERFORM pg_catalog.pg_sleep(0.1);
          
              -- The cooldown reads challenges
    must_fail:
      - pkg: ./internal/api
        tests: [TestADecoyFloodDoesNotRefuseARealOTPRequest]
