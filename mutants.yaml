  - id: argon2-memory-budget-dummy-hashed-around-the-gate
    rule: argon2-memory-budget
    why: NewHasher hashes its dummy at the full configured cost again, with a direct call outside the gate, which is what the console tool paid for inside the admin container (admin-r4-2).
    edits:
      - file: internal/auth/password/password.go
        old: |-
          dummy: secret.New(encode(p, salt, make([]byte, hashLen)))}, nil
        new: |-
          dummy: secret.New(encode(p, salt, argon2.IDKey(salt, salt, p.Time, p.MemoryKiB, p.Threads, hashLen)))}, nil
    must_fail:
      - pkg: ./internal/lint
        tests: [TestArgon2OnlyInTheGate]
      - pkg: ./internal/auth/password
        tests: [TestHasherAllocatesNothingBeforeFirstUse]
  - id: argon2-memory-budget-dummy-hashed-in-new-hasher
    rule: argon2-memory-budget
    why: NewHasher computes the dummy hash eagerly, through the gate this time, so the lint is satisfied and only the build-time count and the entry-point test can see that every service and console tool pays 46 MiB at start.
    docker: true
    edits:
      - file: internal/auth/password/password.go
        old: |-
          return &Hasher{params: p, gate: g, dummy: secret.New(encode(p, salt, make([]byte, hashLen)))}, nil
        new: |-
          sum, err := g.derive(context.Background(), salt, salt, p, hashLen, inSlot)
          	if err != nil {
          		return nil, err
          	}
          	return &Hasher{params: p, gate: g, dummy: secret.New(encode(p, salt, sum))}, nil
    must_fail:
      - pkg: ./internal/auth/password
        tests: [TestHasherAllocatesNothingBeforeFirstUse]
      - pkg: ./internal/app
        tests: [TestNoEntryPointAllocatesArgon2]
