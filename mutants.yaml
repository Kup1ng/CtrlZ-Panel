    docker: true
    why: Check 11 reads only the triggers enabled for origin sessions, so an unlisted trigger that is ENABLE ALWAYS or ENABLE REPLICA, which fires in the mode that skips every ordinary guard, is in neither the live list nor the golden.
    edits:
      - file: internal/store/catalogtest/checks.go
        old: |-
          WHERE c.relnamespace = 'ctrlz'::regnamespace AND NOT t.tgisinternal AND t.tgenabled <> 'O'`)
        new: |-
          WHERE c.relnamespace = 'ctrlz'::regnamespace AND NOT t.tgisinternal AND t.tgenabled = 'O' AND false`)
    must_fail:
