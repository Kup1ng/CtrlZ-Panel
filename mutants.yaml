    rule: role-reach
    finding: db-r18-13
    docker: true
    why: auth_totp_seed is made by the wide role again with its NULL branch back (db-r5-9), so a tenant connection that never set a tenant is handed any user's sealed seed. The scoped owner of 0055 would hide the branch (row-level security shows it no row without a tenant), so the mutant has to take the function back to ctrlz_auth, whose policies show every row, for the missing predicate to matter.
    edits:
      - file: migrations/postgres/0055_review_round18_db.sql
        old: |-
          SET ROLE ctrlz_scoped;
          -- +goose StatementBegin
          CREATE FUNCTION ctrlz_fn.auth_totp_seed(p_user_id uuid, p_tenant_id uuid)
        new: |-
          SET ROLE ctrlz_auth;
          -- +goose StatementBegin
          CREATE FUNCTION ctrlz_fn.auth_totp_seed(p_user_id uuid, p_tenant_id uuid)
      - file: migrations/postgres/0055_review_round18_db.sql
        old: |-
