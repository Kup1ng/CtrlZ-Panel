    rule: one-primitive-per-key
    finding: primitives-r12-3
    why: A sealed column passes a literal as its context, which the runtime floor accepts and which binds the value to no row, so only the lint for an AAD function stands between that and a copied ciphertext opening in another tenant.
    edits:
      - file: internal/sms/payload.go
        old: |-
          return ring.Seal(keyring.DomainSMSCred, credentialsAAD(id, provider), plain.Reveal())
