        tests: [TestTheClaimLeaseStartsWhenTheClaimRunsNotWhenTheTransactionBegan]
  - id: caps-and-endings-outbox-claim-lease-starts-with-the-transaction
    rule: caps-and-endings
    docker: true
    why: The outbox claim lease is stamped with now(), the start of the claim transaction, so a wait on the counter row before the claim comes out of the send's time (the OTP statement had a mutant and a test, the outbox one had neither).
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          SET claimed_until = clock_timestamp() + interval '20 seconds', attempts = o.attempts + 1
        new: |-
          SET claimed_until = now() + interval '20 seconds', attempts = o.attempts + 1
    must_fail:
      - pkg: ./internal/store
        tests: [TestTheOutboxClaimLeaseStartsWhenTheClaimRunsNotWhenTheTransactionBegan]
  - id: caps-and-endings-send-budget-ignores-the-lease-the-claim-has-left
    rule: caps-and-endings
    docker: true
    why: The send gets its full configured budget whatever the claim transaction waited, so a gate that waited on another worker's claim leaves a send that ends after the lease and a second worker sends the code again.
    edits:
