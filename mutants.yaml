      - pkg: ./internal/budget
        tests: [TestWhatARouteSpendsFollowsTheRegistry]
  - id: proof-before-work-password-change-lets-an-sms-session-reach-the-heavy-work
    rule: proof-before-work
    finding: tenant-r7-5
    docker: true
