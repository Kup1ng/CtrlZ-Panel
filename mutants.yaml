  - id: role-reach-declare-lost-chunk-loop-does-not-advance
    rule: role-reach
    finding: db-r14-1
    docker: true
    why: The loop that cuts the seeds of a lost key into calls of 500 does not advance, so a tenant with more users than one call holds is cleared in part and reported done.
    edits:
