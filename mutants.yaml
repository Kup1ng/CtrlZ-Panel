  - id: role-reach-the-watchdog-measures-the-statement-not-the-wait
    rule: role-reach
    finding: db-r18-9
    docker: true
    why: The watchdog takes the start of the waiting statement as the start of its wait again, so an honest holder that is between two statements is ended because of a session whose statement is old and whose wait is moments old.
    edits:
      - file: migrations/postgres/bootstrap/watchdog.sql
        old: |-
          AND wl.waitstart < pg_catalog.clock_timestamp() - pg_catalog.make_interval(secs => :block_secs))
        new: |-
          AND w.state_change < pg_catalog.clock_timestamp() - pg_catalog.make_interval(secs => :block_secs))
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestTheWatchdogMeasuresTheWaitNotTheStatement]
  - id: role-reach-the-watchdog-leaves-a-table-lock-alone
    rule: role-reach
    finding: db-r18-10
    docker: true
    why: The watchdog stops judging the mode of a table lock, so a service role that runs LOCK TABLE ... IN ACCESS EXCLUSIVE MODE on sessions or sms_counters stops every read and write of the table for every tenant for as long as the age rules allow.
    edits:
      - file: migrations/postgres/bootstrap/watchdog.sql
        old: |-
          AND tl.mode NOT IN ('AccessShareLock', 'RowShareLock', 'RowExclusiveLock'))
        new: |-
          AND false)
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestTheWatchdogEndsAServiceBackendThatHoldsATableLock]
