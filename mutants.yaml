  - id: boundary-input-a-folded-request-field-is-on-the-text-pattern
    rule: boundary-input
    finding: primitives-r15-1
    why: The Users filter q, which the handler hands to phone.SearchPrefix, goes back to the text pattern that refuses every mark a paste carries. The hand-kept codeFields floor does not list q, so only the list derived from the handlers (internal/lint/foldfields_test.go) and the schema check of the query parameters can fail.
    edits:
      - file: api/admin-openapi.yaml
