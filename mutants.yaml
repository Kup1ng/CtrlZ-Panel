  - id: lock-order-a-definer-function-writes-an-ordered-table-in-plan-order
    rule: lock-order
    finding: db-r16-19
    docker: true
    why: The console's revocation of a user's sessions goes back to a plain multi-row UPDATE inside its definer function, so it meets the worker's sweep and the user's own revocation (which lock in key order) in the opposite order.
    edits:
      - file: migrations/postgres/0055_review_round18_db.sql
        old: |-
          WHERE x.tenant_id = v_tenant AND x.user_id = p_user_id AND x.revoked_at IS NULL
                 ORDER BY x.id FOR NO KEY UPDATE));
            GET DIAGNOSTICS v_n = ROW_COUNT;
        new: |-
          WHERE x.tenant_id = v_tenant AND x.user_id = p_user_id AND x.revoked_at IS NULL));
            GET DIAGNOSTICS v_n = ROW_COUNT;
    must_fail:
      - pkg: ./internal/store/catalogtest
        tests: [TestDefinerWritesLockInKeyOrder]
  - id: role-reach-declare-lost-writes-a-record-per-five-hundred
    rule: role-reach
    finding: db-r15-5
    docker: true
    why: A call of declare-lost takes 500 seeds again, so a tenant with 1100 lost seeds gets three warnings and three audit rows that say 500, 500 and 100, a log that reads as three smaller operations.
    edits:
      - file: internal/store/worker_sms.go
        old: |-
          const declareLostBatch = 20000
        new: |-
          const declareLostBatch = 500
    must_fail:
