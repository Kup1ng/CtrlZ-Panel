# Expected table, column and view privileges, from spec sections 6 and 7.
#
# Notation: S select, I insert, U update, D delete. A letter alone is a
# table-level grant; S(a,b) is column-level; S(-a-b) is every column except a
# and b, evaluated against the live column list so that a column added later
# fails the test until it is listed or deliberately left out.
# A role with no entry has no privilege on the table. Nothing is granted to PUBLIC.
