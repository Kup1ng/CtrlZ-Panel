# Views, by the role that may select from them.
views:
  hub_endpoint_index: [hub]
  tenant_endpoint_status: [tenant]
  tenant_profile_counts: [tenant]
  admin_tenant_summary: [admin]

# Schema privileges. usage lists the roles (besides the owner) holding USAGE.
# Nobody but the owner holds CREATE anywhere, and public holds nothing at all.
schemas:
  public:    {owner: pg_database_owner, usage: []}
  ctrlz:     {owner: ctrlz_migrator, usage: [tenant, hub, compiler, worker, admin, auth, backfill, keytool, scoped]}
  ctrlz_fn:  {owner: ctrlz_auth, usage: [tenant, worker, admin, keytool]}
  ctrlz_ext: {owner: ctrlz_migrator, usage: []}
  river:     {owner: ctrlz_migrator, usage: [worker]}

# CONNECT on the database for the six service roles (the migrator owns it and
# holds everything implicitly). TEMP is
# not granted, and PUBLIC holds nothing.
database:
  connect: [tenant, hub, compiler, worker, admin, keytool]

# Roles that may call ctrlz.current_tenant_id(). The policies call it with the
# caller's own rights, so every role that touches a tenant table needs it.
current_tenant_id_execute: [tenant, hub, compiler, worker, admin, auth, backfill, keytool, scoped]

# pg_default_acl, as stored. The schema-scoped REVOKE the spec states leaves no
# row; the role-wide REVOKE for ctrlz_auth and the River defaults are ours.
default_acl:
  - {role: ctrlz_migrator, schema: "", objtype: f, acl: "{ctrlz_migrator=X/ctrlz_migrator}"}
  - {role: ctrlz_auth,     schema: "", objtype: f, acl: "{ctrlz_auth=X/ctrlz_auth}"}
  - {role: ctrlz_scoped,   schema: "", objtype: f, acl: "{ctrlz_scoped=X/ctrlz_scoped}"}
  - {role: ctrlz_migrator, schema: river, objtype: r, acl: "{ctrlz_worker=arwdDxtm/ctrlz_migrator}"}
  - {role: ctrlz_migrator, schema: river, objtype: S, acl: "{ctrlz_worker=rwU/ctrlz_migrator}"}
