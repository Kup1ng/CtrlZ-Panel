    no_personal: "operator-owned content and state (catalog entries, versions, digests, node, gateway and job settings); no column is about a person"
    columns: [registration_mode]
  tenant_assets:
    why: "public content and its digest, which nodes and tenants read freely; no credential (db-r6-3)"
    no_personal: "operator-owned content and state (catalog entries, versions, digests, node, gateway and job settings); no column is about a person"
    columns: [bytes, kind, mime, sha256]
  tenant_audit_log:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "action codes, targets as ids and closed params; the address and user agent of the actor are the separate personal columns"
    columns: [action, params, target]
  tenants:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "the tenant's own configuration, labels and statuses; no column is a phone, an address, a device or network name or a place, and a label is what the tenant typed for its own object"
    columns: [home_countries, status]
  unblock_requests:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "the request text a tenant's visitor wrote to the tenant, read by that tenant alone (the hub only inserts, the worker only deletes). The domain asked about is the personal column qname"
    columns: [message, status]
  update_status:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "operator-owned content and state (catalog entries, versions, digests, node, gateway and job settings); no column is about a person"
    columns: [class, last_error, version]
  users:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "locale, theme, onboarding state and role of an account; the phone is the separate personal column phone_e164"
    columns: [locale, onboarding_hints, onboarding_state, role, theme]
  webauthn_config:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "operator-owned content and state (catalog entries, versions, digests, node, gateway and job settings); no column is about a person"
    columns: [allowed_origins, rp_id]
  webauthn_credentials:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "the name the user gave a passkey, its authenticator class and its relying-party id; no phone, address or place"
    columns: [attestation_type, name, rp_id, transports]


# Row predicates that bound a declared reach on a table with row-level security (check 22,
# checkRowBound). A SELECT privilege says nothing about rows; the sender holds SELECT on
# sms_counters because its own statements read the global rows, and its policy shows it those
# and no other. Each predicate must be the one the role's policy states, and the proof with
# seeded rows is TestTheWorkerRoleSeesTheGlobalCounterRowsOnly.
row_bound:
  sms_counters:
    worker: "scope = 'global'"
  # The sender's statements touch only the rows that carry a sealed code (claim, clear, expiry,
  # exhaustion, lease), marked `deliverable` at insert. A decoy (an unknown phone) has a row with
  # the phone and the purpose and no code, and showing it would tell the sender which numbers
  # have no account: the fact the decoy hides (db-r9-3).
  otp_challenges:
    worker: "deliverable"

# Declared readers of a secret or personal column of a global table that are NOT bounded by a policy
# (check 22, checkRowBound): why each needs every row. A reader whose statements need only some rows
# is bounded with row-level security and goes in row_bound instead, so this list is the one place a
# reviewer reads "this role sees the whole table" and decides.
all_rows:
  # Rows of the admin service itself: its operators, their sessions, their audit trail and the
  # invites they issue. No tenant's or visitor's row lives in these tables.
  admin_sessions:
    admin: "the admin service owns the table: the sessions of its own operators, listed and swept by it"
  admin_users:
    admin: "the admin service logs the operators in and manages them; every row is an operator account of the platform"
  audit_log:
    admin: "the Audit page shows the platform audit log to operators in full; the rows are operator and platform events"
  invites:
    admin: "the operators create and list every invite; the console is the one surface that shows them"
  # Operator-owned infrastructure: the panel-node trust, the nodes' proxy configuration and the SMS
  # gateways. A row is a certificate, an enrollment, a location or a gateway of the operator, not
  # about a tenant or a person, and each reader below works on every one of them.
  certificates:
    hub: "the hub serves each node's certificate to it, with the sealed key (the admin issues and the worker renews and neither reads the key back, db-r18-11)"
  node_enrollments:
    admin: "the admin issues enrollments and lists every one"
    hub: "the hub verifies the token of whichever node enrolls"
  node_location_configs:
    admin: "declared as held from P0 (the entry of secrets above); P3 narrows it and this entry goes"
    compiler: "declared as held from P0 (the entry of secrets above); P3 narrows it and this entry goes"
    hub: "declared as held from P0 (the entry of secrets above); P3 narrows it and this entry goes"
    worker: "declared as held from P0 (the entry of secrets above); P3 narrows it and this entry goes"
  sms_gateways:
    admin: "the admin manages every gateway of the operator and tests its credentials"
    worker: "the sender chooses among all gateways by role and breaker, and sends through whichever is up"
  # The outbox holds messages queued to be sent (an admin test message, an invite), not decoys:
  # every row is one the sender sends.
  sms_outbox:
    worker: "every row is a queued message the sender has to send; a decoy never enters the outbox"

  # Tenant tables that a policy other than tenant_isolation shows to a service role in full
  # (admin_read, USING (true)). tenant_isolation bounds whoever opens WithTenant for one tenant;
  # these roles do not, so the reason is written here and not left to the policy (db-r10-2).
  users:
    admin: "the Users page lists every tenant's users to the operators (GET /users, filtered by phone prefix, no log data), and the invite and recovery flows look a user up across tenants; the policy is admin_read"
  ip_claims:
    admin: "the claims page lists every claim of every tenant to the operators and releases or suspends one (admin_read); a claim is a cidr, and an overlap across tenants is what the console exists to show"
