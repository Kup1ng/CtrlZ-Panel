# Role reach (P1 auth review round 5, rule 2 "role-reach"; spec 16.2a).
#
# DEFAULT DENY. For the tables below no LOGIN role holds INSERT or UPDATE on a
# column unless this file declares it, and for the secret columns none holds SELECT
# unless this file declares it. A column added later is guarded from its first day
# (only the columns named in `free` are open), a role added later is denied
# everything (the test loops over pg_roles, not over a list), and a grant that is
# declared here but no longer held fails too, so the list can only shrink without
# a reviewed diff.
#
# Why a deny list of nothing and an allow list of everything: column grants cannot
# restrict the value written or the rows touched, so every change that takes a
# second factor, a credential, a revocation or a trail row out of the owning
# service's hands is ONE SECURITY DEFINER function owned by NOLOGIN ctrlz_auth
# (functions.yaml, `trail` or `no_trail`), which checks its precondition against
# database state and is EXECUTE-granted to one login role. `declared` below is only
# for the service that is itself the author of that data: the tenant API for its own
# tenant's users, sessions and tokens (every statement is bounded by tenant_isolation
# and the setting it set), the admin API for its own admin_users and admin_sessions
# and the invites it hands out, the SMS worker for the bookkeeping of the messages it
# sends. Each of those is a reviewed line, and none lets another role in.
#
# Roles are the short names of grants.yaml (ctrlz_<short>).

# LOGIN roles that are not judged: they own the tables, so Postgres gives them every
# privilege and a REVOKE cannot take it away. ctrlz_migrator is bound by FORCE RLS
# (it sees no row without a tenant setting, TestMigratorSeesNothing) and logs in
# only from the address of the migrate container (deploy/compose pg_hba.conf).
owners: [migrator]

# Tables whose columns are written only by a declared role. `free` lists the columns
# any role may write (none of them is a credential, a factor, a revocation, a token
# or a bookkeeping field). `declared` maps a role to the columns it may write, or
# "*" for every guarded column of the table.
write:
  users:
    free: [locale, theme, onboarding_hints, onboarding_state, last_login_at, created_at, updated_at]
    declared:
      # The user's own password change, TOTP enrolment, Enforce Passkey and review
      # flags, under the user row lock of the tenant API. Never the worker, the key
      # tool or the admin: they go through the functions of functions.yaml.
      tenant: [password_hash, totp_secret_ct, totp_enabled_at, totp_last_step, enforce_passkey, totp_pending_at, enforce_lift_at, passkey_review_at]
  # The tenant row itself. status and admin_hold are an admin decision (suspend, hold) and
  # deleted_at is the purge's clock; the tenant owner writes only its own settings. The
  # worker held UPDATE (status, deleted_at) and could undo a suspension or lock a healthy
  # tenant out (db-r5-6); the purge, when P5 builds it, is a definer function.
  tenants:
    free: [home_countries, raw_retention_days, aggregate_retention_months, created_at, updated_at]
    declared:
      admin: [status, admin_hold]
  sessions:
    free: [last_seen_at, created_at, updated_at, ip, user_agent]
    declared:
      tenant: "*"
  refresh_tokens:
    free: [created_at, updated_at]
    declared:
      tenant: "*"
  api_tokens:
    free: [created_at, updated_at]
    declared:
      tenant: "*"
  webauthn_credentials:
    free: [created_at, updated_at]
    declared:
      tenant: "*"
  recovery_codes:
    free: [created_at]
    declared:
      tenant: "*"
  phone_change_requests:
    free: [created_at, updated_at]
    declared:
      tenant: "*"
  setup_share_tokens:
    free: [created_at]
    declared:
      tenant: "*"
  profile_download_tokens:
    free: [created_at]
    declared:
      tenant: "*"
  # The one-time state (must_change_password, password_expires_at, and the stamps that
  # go with it) moves only through the ctrlz_fn.admin_account_* functions (rule
  # one-time-state), so the admin API holds the rest of its own row and nothing of that.
  admin_users:
    free: [created_at, updated_at]
    declared:
      admin: [password_hash, totp_secret_ct, totp_last_step, disabled_at, last_login_at, pending_notice]
  admin_sessions:
    free: [created_at, ip, user_agent]
    declared:
      admin: "*"
  # An invite is created and revoked by the admin API. It never writes the
  # accepted-by or used-at columns: auth_register_user does, as ctrlz_auth.
  invites:
    free: [created_at]
    declared:
      admin: [id, token_hash, phone_e164, locale, created_by, expires_at, revoked_at]
  # No login role holds anything on these two: the functions of ctrlz_fn do.
  auth_tickets:
    free: []
    declared: {}
  auth_throttle:
    free: []
    declared: {}
  # The code hash and its attempts are ctrlz_auth's. The sender keeps the sealed
  # delivery copy and its claim, and writes nothing else. It READS the code hash: see the read
  # section below (primitives-r18-14).
  otp_challenges:
    free: [created_at]
    declared:
      worker: [delivery_ct, delivery_claimed_until, delivery_attempts]
  # The admin queues a test message with the columns of store.qSMSOutboxInsert; the
  # state, the attempt count, the claim and the send time are the worker's and take
  # their defaults when the admin inserts (sms-r4-7).
  sms_outbox:
    free: [created_at]
    declared:
      admin: [id, kind, gateway_id, phone_e164, template_key, locale, params_ct, created_by]
      worker: [state, attempts, claimed_until, last_error, sent_at, params_ct]
  # The per-phone, per-network and cost counters of the daily caps: the worker
  # refunds, adds cost and sweeps them; the admin reads the global rows through
  # admin_sms_stats and writes nothing.
  sms_counters:
    free: []
    declared:
      worker: "*"

# Columns no login role may SELECT unless declared. Per table, per column, the roles.
# [] is nobody: only ctrlz_auth (NOLOGIN) and its functions read the column.
read:
  users:
    password_hash: []
    # The rekey container opens and re-seals every seed under the old and the new
    # key; it is the one role with the user_totp key ring.
    totp_secret_ct: [keytool]
  admin_users:
    password_hash: [admin]
    totp_secret_ct: [admin]
  admin_sessions:
    token_hash: [admin]
  sessions:
    token_hash: [tenant]
  refresh_tokens:
    token_hash: [tenant]
  api_tokens:
    token_hash: [tenant]
  recovery_codes:
    code_hash: [tenant]
  invites:
    token_hash: []
  setup_share_tokens:
    token_hash: [tenant]
  profile_download_tokens:
    token_hash: [tenant]
  auth_tickets:
    token_hash: []
    payload: []
  # The sender reads the code hash back for one reason: the sealed delivery copy is bound to the
  # hash of its own row (P1 auth review round 18, primitives-r18-2, D64 otp-aad-row), so the
  # sender cannot open a copy that was moved onto another challenge. The sender holds no auth_mac
  # key and reads the code in the clear when it opens the copy, so the hash gives it nothing it
  # could not already compute and no way to test a guess.
  otp_challenges:
    code_hash: [worker]
    delivery_ct: [worker]
  # The raw keys are phones, networks and addresses, decoys included, and "<phone>|trusted"
  # says a request came from a known device. The sender holds SELECT because its statements read
  # the global rows, and row-level security (migration 0035, policy worker_global_rows) shows it
  # those rows and no other: see row_bound below, which check 22 compares with the live policy,
  # and sms-r8-3 and sms-r8-7, which found the worker reading every phone and address of the
  # last three days through this column (sms-r6-2 had taken the same facts from otp_challenges).
  sms_counters:
    key: [worker]
  # Sealed under sms_cred, which opens the provider's API key or password (sms-r5-5).
  # The worker reads it to send. The admin role reads it because the admin container
  # also runs `ctrlz-admin keys rekey sms_cred` and `keys status`, which open and
  # re-seal it, and because its gateway queries test `credentials_ct IS NOT NULL`,
  # which needs SELECT on the column. No HTTP route of the admin API selects the
  # column or opens it back (SMSCredentialsSealed has two callers, both in admincli),
  # so the reach is the container's, not the routes'; code execution or an injection
  # inside the admin API could still use it, with the key in the same process. That is
  # the declared cost. Closing it takes a migration (a generated `configured` column
  # in place of the NULL test) and moving rekey to the keytool role; it is recorded as
  # a follow-up in Plan.md and not done in round 5. Every other role, the tenant API
  # and the compiler first, stays out, and a new reach fails check 22.
  sms_gateways:
    credentials_ct: [admin, worker]
    # The credentials a PUT saved and the console has not confirmed (0055): sealed the same way, readable by
    # the same two roles for the same reasons (rekey re-seals them, `keys status` counts them, and the worker
    # reads the row with a table-level SELECT), and selected by no sender (admin-r18-1).
    credentials_pending_ct: [admin, worker]

# Trail tables: the evidence of what happened to an account. A login role may append,
# and may not UPDATE or DELETE a row unless declared here. `update` maps a role to
# the columns it may update (a flag such as the read mark, never the content);
# `delete` maps a role to the name of the RESTRICTIVE policy that bounds its DELETE by
# the age of the row (policies.yaml holds the text). TRUNCATE is refused to everybody.
trail:
  tenant_audit_log:
    update: {}
    delete:
      worker: worker_retention
  notifications:
    update:
      tenant: [read_at]
    delete: {}
  audit_log:
    update: {}
    delete: {}
  sms_deliveries:
    update: {}
    delete: {}

# Credential generation (P1 auth review round 5, rule 5 "credential-generation";
# catalog check 25, internal/lint credgen rule, spec 3.7, 5.5, 5.7, 10.2, 16.1).
#
# users and admin_users carry credential_gen, a counter that a BEFORE UPDATE
# trigger (ctrlz.credential_gen_bump) moves whenever one of `columns` changes, whoever
# writes (a route, a definer function, the console, the table owner). Every artefact
# derived from a first-factor check (the session opened after Argon2, an mfa ticket,
# a rehash write, a device marker, a reauth) carries the (subject, generation) it was
# derived from, and internal/credgen refuses it when either differs. No consumer
# compares a hand-picked list of fields any more, so a column added later cannot be
# forgotten by one of them.
#
# Every guarded column of the two tables (the live columns minus `free` in `write`)
# is either a credential column (`columns`: the trigger's arguments, read from the live
# trigger) or has a reason in `other`. A column that is in neither fails check 25, so
# adding a guarded column forces the decision. A credential column is one whose change
# makes what a past verification proved worth less: the secrets, the factors, the
# one-time state, the login identity and whatever switches the login off or changes
# what it must ask for.
# One rule inside the trigger function is not a column of this list (migration 0029, db-r6-4): a
# change of totp_secret_ct does not move the generation when totp_enabled_at is set and the same
# on both sides, because the factor in force is the same one and the ciphertext can only have been
# re-sealed under another key (`ctrlz rekey`). A seed written while no factor is in force, a factor
# turned on, off or replaced (totp_enabled_at) all still move it.
credential_gen:
  users:
    columns: [phone_e164, password_hash, password_changed_at, password_expires_at, must_reset, totp_secret_ct, totp_enabled_at, enforce_passkey, enforce_lift_at]
    other:
      tenant_id: "key; a row never moves between tenants"
      id: "key"
      role: "a single value in v1 (CHECK role = 'owner')"
      phone_verified_at: "stamped by the SMS proof itself (auth_phone_mark_verified), which is the artefact, not a credential it checks"
      totp_last_step: "the replay counter of the second factor: it moves on every accepted code, so counting it would end every ticket the moment a code is used"
      totp_pending_at: "an enrolment that is not a factor yet; confirming it moves totp_enabled_at, and starting it moves totp_secret_ct"
      passkey_review_at: "a flag on passkeys, which are rows of webauthn_credentials and not columns here"
      credential_gen: "the counter itself; the trigger overwrites whatever a writer puts there"
  admin_users:
    columns: [username, password_hash, password_changed_at, password_expires_at, must_change_password, totp_secret_ct, totp_enabled_at, disabled_at]
    other:
      id: "key"
      totp_last_step: "the replay counter of the second factor"
      last_login_at: "a record of the login, written by the login itself"
      pending_notice: "a notice shown at the next sign-in; no factor reads it"
      credential_gen: "the counter itself"

# DELETE (P1 auth review round 5, findings db-r5-1 and db-r5-6; catalog check 22).
#
# Default deny, like the columns: for every write-guarded table, the roles that may delete
# its rows, each with the reason. {} is nobody. A role is counted as deleting a table when it
# holds DELETE on it OR on any parent whose ON DELETE CASCADE reaches it (read from
# pg_constraint): the cascade runs as the table owner, so it is bounded by nothing the
# child's grants or policies say. A cascade into a TRAIL table is never allowed (the trail
# section above has no cascade entry to declare). TRUNCATE is refused to every role on every
# table of the schema, with no list.
#
# Nobody deletes a user, an admin or a tenant as a service: the account purge is a P5 job
# and arrives as a definer function that deletes only a tenant in status 'deleting' past the
# grace period, with its own line here. Until then a role that could delete the root of
# those cascades could erase every credential, factor and trail row of a tenant (the worker
# held DELETE on tenants, db-r5-6), or empty admin_users so that the console bootstrap hands
# a fresh account to whoever calls it (the admin held it, db-r5-1).
delete:
  tenants: {}
  users: {}
  admin_users: {}
  auth_tickets: {}
  auth_throttle: {}
  sessions:
    tenant: "logout and password change remove the user's own sessions of its tenant"
    worker: "the retention sweep, a day past the absolute expiry (qSweepSessions)"
  refresh_tokens:
    tenant: "rotation and logout remove the user's own refresh tokens of its tenant"
    worker: "the retention sweep, a day past the expiry (qSweepRefresh)"
  api_tokens:
    tenant: "a user deletes its own API tokens"
  webauthn_credentials:
    tenant: "a user removes its own passkeys"
  recovery_codes:
    tenant: "regeneration replaces the whole set of the user (qRecoveryDelete)"
  phone_change_requests:
    worker: "the retention sweep, a day past the expiry (qSweepPhone)"
  setup_share_tokens:
    tenant: "a user deletes the share links of its own Endpoints, and an Endpoint's delete cascades"
    worker: "the retention sweep of expired links"
  profile_download_tokens:
    tenant: "a user deletes the download links of its own Endpoints, and an Endpoint's delete cascades"
    worker: "the retention sweep of expired links"
  admin_sessions:
    admin: "the admin service sweeps its own sessions a day past their end (qAdminSessionsDeleteExpired)"
  invites:
    worker: "the retention sweep, 90 days past the expiry (qSweepBatchInvites)"
  sms_outbox:
    worker: "the retention sweep, 30 days after creation (qSweepBatchOutbox)"
  # Nobody holds DELETE: the retention sweep of the raw per-phone, per-network and per-address
  # counters is ctrlz_fn.worker_sweep_sms_counters, and a trigger refuses any delete inside
  # the retention for every role (sms-r8-3, sms-r8-6).
  sms_counters: {}
  # Nobody holds DELETE here either: the 24 hour retention sweep is ctrlz_fn.worker_sweep_otp_challenges,
  # because the sender cannot see the decoy rows it would have to delete (db-r9-3).
  otp_challenges: {}

# Secret columns of tables outside the auth set (P1 auth review round 5, finding db-r5-8),
# in the shape of `read`. Check 22 finds every column whose NAME looks secret (a sealed
# value `*_ct`, a `*_hash`, anything with `secret` in it, or a column called payload,
# credential(s), token or password) across the whole schema and fails one that is in none of
# `read`, `secrets` and `read_open`, so a column added tomorrow cannot be readable by a role
# nobody decided on. This file is a separate section from `read` only because clocks.yaml
# covers the tables of `read` and `write`, and those are the auth tables.
secrets:
  # The sealed key of a certificate. Only the hub reads it back, to serve it to nodes (certificates are the
  # panel-node trust, spec PS 7). The admin issues and the worker renews, and both only WRITE a sealed key: an
  # INSERT or an UPDATE of the column needs no SELECT on it, so neither holds one (P1 auth review round 18,
  # db-r18-11: the same class as the sealed SMS credentials, a role that never opens a sealed secret does not
  # read it, because the day the P6 key ring is mounted in its container a compromised process could open every
  # node's TLS key with no trace). A role that must read it back adds itself here with the reason.
  certificates:
    wrapped_key_ct: [hub]
  # The sealed DoH token of an Endpoint, and the hash the resolver looks it up by.
  endpoints:
    doh_token_ct: [tenant]
    doh_token_hash: [compiler]
    # The id in the address of the Endpoint: whoever knows it can use the Endpoint's profile, so
    # it is a capability like the token, and its readers are a reviewed list (db-r6-3).
    resolver_id: [compiler, tenant]
  # The hub writes the hash of the TXT code it derived and never reads it back; the claim
  # function compares it as ctrlz_auth.
  ip_proof_challenges:
    txt_code_hash: []
  # The hash of a node's one-time enrollment token.
  node_enrollments:
    token_hash: [admin, hub]
  # The sealed invite parameters (the invite token among them) that only the sender opens.
  sms_outbox:
    params_ct: [worker]
  # The hash of the password that unlocks a locked profile. The compiler and the worker read
  # it only because P0 gave them table-level SELECT on profiles; neither needs it. Declared as
  # held (this round pins the reach, it does not rewrite P0 grants), and the day a migration
  # narrows them to S(-lock_password_hash) this entry fails as stale and shrinks.
  profiles:
    lock_password_hash: [compiler, tenant, worker]
  # The hash key of a throttle line: an HMAC of a phone, an address or an account, which only the
  # definer functions of ctrlz_auth read and write (db-r6-10).
  auth_throttle:
    key: []
  # The stored answer of a replayed call. It can hold whatever the call returned, a one-time
  # token or a recovery code included, so it is decided as a secret, not by its name (db-r6-3).
  idempotency_keys:
    response: [tenant]
  # A fragment of the proxy configuration of a node location: the outbound it names carries
  # the credentials of the upstream (P3), so it is decided as a secret before the P3 code exists. The four
  # roles hold table-level SELECT from P0, declared as held; P3 narrows them to what each needs,
  # and the entry then fails as stale and shrinks.
  node_location_configs:
    fragment: [admin, compiler, hub, worker]
    last_good_fragment: [admin, compiler, hub, worker]

# Personal data (P1 auth review round 7, finding db-r7-5): the columns that record a phone
# number, an address or a user agent, so which person did what from where. They hold no
# credential, so the secret test never asked about them, and only the grants golden stood between
# a role and the record of which address asked a code for which phone; a grant added to the
# golden and grants.yaml in one commit passed it. Check 22 finds every column named like a phone
# (phone, msisdn, e164), an email, a user agent or an address (ip, ips) of a type that can hold
# the value (a flag, a time or a counter with such a name is not asked), across the whole schema,
# and fails one that is in neither `personal` nor `personal_open`. A column of any other name can
# be listed here too (otp_challenges.trusted records how the address was judged). Readers are
# the roles that may SELECT it, the same list as `read`, and a role that holds it undeclared, or
# a declared one that no longer does, fails.
personal:
  admin_sessions:
    ip: [admin]
    user_agent: [admin]
  api_tokens:
    allowed_ips: [tenant]
  audit_log:
    ip: [admin]
  # Where a tenant's person is on the network: the prefix, the city and the provider of an authorized
  # address (db-r8-2). The prefix is what policy.proto carries to the nodes (the compiler) and what the
  # hub matches a query against; the city and the provider are shown to the tenant and written by the
  # worker that learns an address. ctrlz_compiler was narrowed to the prefix in 0037.
  authorized_ips:
    cidr: [compiler, hub, tenant, worker]
    city: [tenant, worker]
    isp: [tenant, worker]
  # The device behind a client row. ClientRecord (policy.proto) carries none of the three, so the
  # compiler holds none (0037).
  clients:
    hostname: [tenant, worker]
    ip: [tenant, worker]
    mac: [tenant, worker]
  endpoint_ddns_hosts:
    hostname: [tenant, worker]
    last_ips: [tenant, worker]
  invites:
    phone_e164: [admin]
  # The prefix a tenant claimed. ClaimRecord (policy.proto) carries it, the admin approves a wide
  # claim by reading it, ctrlz_auth (a NOLOGIN role, so not listed) makes and moves claims, and the worker
  # reaches the table for the grace sweep.
  ip_claims:
    cidr: [admin, compiler, tenant, worker]
  # Nobody reads the address that observed a challenge: the claim function compares it as ctrlz_auth.
  ip_proof_challenges:
    observed_ip: []
  # Which address asked a code for which phone, and how the address was judged. The sender reads the
  # phone it sends to and nothing else of the row (sms-r6-2 took ip and trusted away); only ctrlz_auth
  # and its functions read the address.
  otp_challenges:
    ip: []
    phone_e164: [worker]
    trusted: []
  phone_change_requests:
    new_phone_e164: [tenant]
  # The EDNS client subnet a tenant chose to send upstream: the tenant types the network it wants to look
  # like, which can be its own. Read by the tenant and by the compiler that writes it into the policy. The worker holds the
  # P0 table-level SELECT for its location availability job (declared as held, to narrow when that job
  # exists).
  profile_options:
    ecs_v4: [compiler, tenant, worker]
    ecs_v6: [compiler, tenant, worker]
  sessions:
    ip: [tenant]
    user_agent: [tenant]
  sms_outbox:
    phone_e164: [worker]
  # The domain a visitor of a tenant asked to have unblocked: behaviour of the tenant's people.
  unblock_requests:
    qname: [tenant]
  tenant_audit_log:
    ip: [tenant]
  users:
    phone_e164: [admin, tenant]

# Personal-looking columns that name no person, with the reason, for any role holding the table.
personal_open:
  locations:
    city: "the city of a point of presence the operator owns; infrastructure, not a person"
  entitlement_defaults:
    max_authorized_ips: "a limit on how many addresses a tenant may authorize, a count; no address is stored in it"
  profile_options:
    block_custom_v4: "the address a tenant chose to answer a blocked name with; a setting, not the address of a person"
    block_custom_v6: "the address a tenant chose to answer a blocked name with; a setting, not the address of a person"
    default_target_ipv4: "the address a tenant chose as the default redirect target; a setting, not the address of a person"
    default_target_ipv6: "the address a tenant chose as the default redirect target; a setting, not the address of a person"
  profile_services:
    target_ipv4: "the address a tenant chose to send a service to; a setting, not the address of a person"
    target_ipv6: "the address a tenant chose to send a service to; a setting, not the address of a person"
  rule_folders:
    target_ipv4: "the address a tenant chose to answer a folder's names with; a setting, not the address of a person"
    target_ipv6: "the address a tenant chose to answer a folder's names with; a setting, not the address of a person"
  rules:
    target_ipv4: "the address a tenant chose to answer a rule's name with; a setting, not the address of a person"
    target_ipv6: "the address a tenant chose to answer a rule's name with; a setting, not the address of a person"
  system_settings:
    otp_cap_ip: "a limit on codes per network, a count; no address is stored in it"
    otp_cap_phone: "a limit on codes per phone, a count; no phone is stored in it"
    otp_cap_phone_net: "a limit on codes per phone and network, a count; neither is stored in it"
    otp_cap_phone_trusted: "a limit on codes per phone for a trusted network, a count; neither is stored in it"
  tenant_entitlements:
    max_authorized_ips: "a limit on how many addresses a tenant may authorize, a count; no address is stored in it"
  node_enrollments:
    bound_ip: "the address of a node the operator owns that an enrollment token is bound to; infrastructure, not a person"
  node_upstreams:
    address: "the address of an upstream resolver the operator configured; infrastructure, not a person"
    bootstrap_ip: "the address of an upstream resolver the operator configured; infrastructure, not a person"
  nodes:
    dns_advertised_ip: "the address of a node the operator owns, published in DNS; infrastructure, not a person"
    dns_bind_ip: "the address a node of the operator listens on; infrastructure, not a person"
    proxy_advertised_ip: "the address of a node the operator owns, published for the proxy; infrastructure, not a person"
    proxy_bind_ip: "the address a node of the operator listens on for the proxy; infrastructure, not a person"

# Columns whose name looks secret and that any role with the table may read, with the
# reason. They are digests of public or the caller's own data, or links in a hash chain.
read_open:
  # Numeric columns are decided by name too (db-r7-5): an integer can hold a code or a PIN. These
  # hold none.
  admin_users:
    credential_gen: "a counter that moves when a credential changes; it proves that something changed and reveals nothing of the credential"
  users:
    credential_gen: "a counter that moves when a credential changes; it proves that something changed and reveals nothing of the credential"
  entitlement_defaults:
    max_api_tokens: "a limit, the number of API tokens a tenant may hold"
  tenant_entitlements:
    max_api_tokens: "a limit, the number of API tokens a tenant may hold"
  audit_log:
    entry_hash: "a link of the admin audit chain; it proves order and holds no secret (spec 13.1)"
    prev_hash: "the previous link of the admin audit chain"
  config_log:
    entry_hash: "a link of the config log chain that nodes verify"
    prev_hash: "the previous link of the config log chain"
    payload: "the signed config entry every node downloads; it holds no credential"
  config_snapshot:
    entry_hash: "the hash of a config snapshot that nodes verify"
  idempotency_keys:
    status_code: "the HTTP status of the stored answer, a number of three digits that opens nothing"
    request_hash: "a digest of the caller's own request body, compared to detect a replay"
    key: "the Idempotency-Key header the caller chose; it names a replay and opens nothing, and the row is the caller's own under the tenant policy"
  profile_download_tokens:
    params_hash: "a digest of the parameters a link was made for; the token itself is token_hash"
  profiles:
    compiled_hash: "the digest of the compiled policy, which nodes compare"
  api_tokens:
    token_prefix: "the first characters of a token, kept to tell tokens apart in the list; too short to use and never the token (the token is token_hash)"
  catalog_versions:
    key: "the table hash key of a catalog version, a public identifier nodes use to ask for the table"
  certificates:
    chain_pem: "the public certificate chain, which every node and client receives; the sealed private key is wrapped_key_ct"
  endpoint_types:
    key: "the name of an Endpoint type in the catalog (a closed vocabulary)"
  locations:
    country_code: "an ISO country code of a node location"
  rules:
    rule_key: "the normalised match key of a custom rule, the tenant's own domain or address"
  sms_deliveries:
    template_key: "the name of the SMS template that was sent (a closed vocabulary), not its parameters"
  sms_gateways:
    last_error_code: "the provider's error code of the last failure, from a closed alphabet (sms.Field)"
    held_code: "the closed code of the refusal that put the gateway on hold (an sms.Code, at most 32 characters of one alphabet); a status number of the provider or a fixed word, never a piece of its reply"
  sms_outbox:
    template_key: "the name of the SMS template (a closed vocabulary); the parameters are params_ct"
  sms_provider_templates:
    key: "the name of an SMS template at a provider (a closed vocabulary)"
  sms_templates:
    key: "the name of an SMS template (a closed vocabulary)"
  webauthn_credentials:
    credential_id: "the id of a passkey, which the browser sends in the clear with every assertion; it opens nothing without the private key"
    public_key: "the public half of a passkey, which verifies an assertion and cannot sign one"

# Free-form columns (text, bytea, jsonb, arrays) whose name does not look secret and that hold
# no credential, per table with the reason (db-r6-3, db-r6-10). The name test alone failed open:
# a column added tomorrow as accept_token, api_key, otp_seed or code would not have matched it.
# Now every column of a free-form type is decided the day it exists, whatever it is called, so
# one that is in none of read, secrets, read_open and this list fails check 22. A fixed-width
# column (a counter, a time, a flag, an address, an id) cannot hold a credential and is not asked.
open:
  admin_jobs:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "operator-owned content and state (catalog entries, versions, digests, node, gateway and job settings); no column is about a person"
    columns: [kind, params, progress, state]
  admin_users:
    why: "names, settings, statuses, closed vocabularies and the caller's own data; no credential, seed, token or key (db-r6-3)"
    no_personal: "an operator account name and a notice code; the name identifies an operator, not a tenant's person, and its readers are fixed by the admin grants"
