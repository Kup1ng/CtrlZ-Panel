# Every foreign key in ctrlz, as "child(columns) -> parent(columns) on_delete".
# Between two tenant tables, every key is composite with tenant_id first on
# both sides (a child can never point at another tenant's parent). A key from a
# tenant table to a global table is allowed and listed here; a key from a
# global table to a tenant table does not exist. A key that is deferrable ends with
# `deferred` (deferrable and initially deferred) or `deferrable` (deferrable and
# initially immediate); an unmarked key is immediate, so a key cannot become deferred
# without a line here. The test compares this list
# with pg_constraint in both directions, so dropping a key is a failure.
