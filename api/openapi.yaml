      description: |
        Up to 500 ids. A delete or a change that takes a locked profile away needs its lock password in `lock_passwords`.
        Errors: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `endpoint_held`, `destinations_lost`,
        `validation_failed`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      x-ctrlz-max-body: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndpointBatch"}
      responses:
        "200":
          description: How many Endpoints the operation touched.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AffectedCount"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}:
    get:
      tags: [endpoints]
      operationId: getEndpoint
      summary: One Endpoint
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The Endpoint.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Endpoint"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [endpoints]
      operationId: patchEndpoint
      summary: Change an Endpoint
      description: |
        Errors: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `destinations_lost`, `validation_failed`
        (`needs_authorized_ip`, `same_profile`), `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndpointPatch"}
      responses:
        "200":
          description: The Endpoint.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Endpoint"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}:delete:
    post:
      tags: [endpoints]
      operationId: deleteEndpoint
      summary: Delete an Endpoint
      description: 'Errors: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `endpoint_held`, `server_busy`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LockPasswordsBody"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}:rotate-resolver:
    post:
      tags: [endpoints]
      operationId: rotateEndpointResolver
      summary: Draw a new resolver id and DoH token
      description: |
        Every device must be set up again and every share and download link of the Endpoint ends. Errors:
        `profile_locked`, `invalid_credentials`, `too_many_attempts`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LockPasswordsBody"}
      responses:
        "200":
          description: The Endpoint, with its new resolver id.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Endpoint"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/schedule:
    get:
      tags: [endpoints]
      operationId: getEndpointSchedule
      summary: The schedule of an Endpoint
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The zone and the windows, ordered by start.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [endpoints]
      operationId: putEndpointSchedule
      summary: Replace the schedule of an Endpoint
      description: |
        The windows are in minutes of the week, Sunday 00:00 being 0, in multiples of 30. Errors: `profile_locked`,
        `invalid_credentials`, `too_many_attempts`, `destinations_lost`, `validation_failed` (`grid`, `overlap`, `exceeded`),
        `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SchedulePut"}
      responses:
        "200":
          description: The schedule as stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoint-groups:
    get:
      tags: [endpoints]
      operationId: listEndpointGroups
      summary: The tenant's Endpoint groups
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: The groups, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [endpoints]
      operationId: createEndpointGroup
      summary: Create a group, and move Endpoints into it
      description: 'Errors: `validation_failed` (`max_endpoint_groups` exceeded).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupCreate"}
      responses:
        "201":
          description: The group.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Group"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoint-groups/{gid}:
    patch:
      tags: [endpoints]
      operationId: patchEndpointGroup
      summary: Rename a group
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupRename"}
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Group"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [endpoints]
      operationId: deleteEndpointGroup
      summary: Delete a group; its Endpoints stay, with no group
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/GroupId"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/clients:
    get:
      tags: [endpoints]
      operationId: listClients
      summary: The clients of an Endpoint, newest first
      description: '`count` is how many clients match the filter, whatever the page.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 64, pattern: *pasted, x-ctrlz-rowref: false}
        - name: group
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 64, pattern: *nametext, x-ctrlz-rowref: false}
        - name: inactive_days
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 3650}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [endpoints]
      operationId: createClient
      summary: Add a custom client
      description: |
        The label is given or derived from the alias; `default` is the hub's own. Errors: `profile_locked`,
        `invalid_credentials`, `too_many_attempts`, `destinations_lost`, `validation_failed` (`exists`, `reserved`,
        `max_clients_per_endpoint` exceeded), `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientCreate"}
      responses:
        "201":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/clients/{cid}:
    patch:
      tags: [endpoints]
      operationId: patchClient
      summary: Change a client
      description: |
        Errors: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `destinations_lost`, `validation_failed`,
        `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ClientId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientPatch"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/clients:batch:
    post:
      tags: [endpoints]
      operationId: batchClients
      summary: Edit or delete clients by id or by a selector
      description: |
        Exactly one of `ids` and `selector`. A selector resolves at most 500 clients in the write; `more` says matches
        remain, so the caller repeats. Errors: as for a change of one client.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientBatch"}
      responses:
        "200":
          description: How many clients were changed, and whether matches remain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientBatchResult"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ddns-hosts:
    get:
      tags: [endpoints]
      operationId: listDdnsHosts
      summary: The Dynamic DNS hosts of an Endpoint
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The hosts, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DdnsHostList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [endpoints]
      operationId: createDdnsHost
      summary: Add a Dynamic DNS host
      description: |
        At most five an Endpoint. A host never proves an address (spec 4.5). Errors: `validation_failed` (`invalid`, `exceeded`,
        `exists` on `/hostname`, `max_ddns_hosts` exceeded).
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DdnsHostCreate"}
      responses:
        "201":
          description: The host.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DdnsHost"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ddns-hosts/{hid}:delete:
    post:
      tags: [endpoints]
      operationId: deleteDdnsHost
      summary: Delete a Dynamic DNS host and the addresses it learned
      description: |
        The rows the host learned go through the same rules as an authorized delete (spec 5). Errors: `validation_failed`
        (`current_address`, `last_authorized`), `profile_locked`, `invalid_credentials`, `too_many_attempts`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/DdnsHostId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LockPasswordsBody"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/authorized-ips:
    get:
      tags: [authorized-ips]
      operationId: listAuthorizedIps
      summary: The authorized addresses of an Endpoint, newest first
      description: '`is_current` marks the row that holds the address of this request: its delete is refused (spec 5 rule 1).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: q
          in: query
          required: false
          description: A part of the address, as text.
          schema: {type: string, maxLength: 64, pattern: *pasted, x-ctrlz-rowref: false}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorizedPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [authorized-ips]
      operationId: addAuthorizedIps
      summary: Add up to 100 addresses or subnets
      description: |
        IPv4 /16 or narrower, IPv6 /32 or narrower. Any refused prefix refuses the request, each named by its index in `cidrs`.
        Errors: `validation_failed` (`invalid`, `out_of_range`, `exists`, `duplicate`, `max_authorized_ips` exceeded).
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizedAdd"}
      responses:
        "201":
          description: The rows made.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorizedAdded"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/authorized-ips/{aid}:
    patch:
      tags: [authorized-ips]
      operationId: patchAuthorizedIp
      summary: Opt a row in or out of the automatic cleanup
      description: 'Turning it on while the Endpoint requires authorized IPs needs the lock passwords. Errors: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `server_busy`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/AuthorizedId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizedPatch"}
      responses:
        "200":
          description: The row.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorizedIP"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/authorized-ips:delete:
    post:
      tags: [authorized-ips]
      operationId: deleteAuthorizedIps
      summary: Delete authorized addresses
      description: |
        All or none. The row that holds the address of the request, and the last row of an Endpoint that requires authorized IPs,
        are not deleted: `validation_failed` with `current_address` or `last_authorized` on the indexes of `ids`. While Require is
        on the lock passwords are needed: `profile_locked`, `invalid_credentials`, `too_many_attempts`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorizedDelete"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ip-claims:
    get:
      tags: [endpoints]
      operationId: listIpClaims
      summary: The Plain DNS addresses of an Endpoint
      description: A claim carries its live challenge, with whether the hub saw it and over which protocol, never from which address.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The claims that are not released.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IPClaimList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [endpoints]
      operationId: requestIpClaim
      summary: Ask for a Plain DNS address
      description: |
        Exactly one of `cidr` and `use_my_address`. A claim that needs an admin says `needs_admin`. Charged to `ip-claim` too.
        Errors: `validation_failed` (`reserved_range`, `unsupported_family`, `exists` on `/cidr`, `max_ip_claims` exceeded),
        `ip_suspended`, `rate_limited`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-rate-also: ip-claim
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IPClaimRequest"}
      responses:
        "201":
          description: The claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IPClaim"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ip-claims/{claim_id}/challenges:
    post:
      tags: [endpoints]
      operationId: openIpClaimChallenge
      summary: Open a proof challenge
      description: 'Charged to `ip-claim` too. Errors: `too_many_attempts` (with `Retry-After`), `ip_suspended`, `rate_limited`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-rate-also: ip-claim
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ClaimId"}
      responses:
        "201":
          description: The challenge and the values to prove with.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Challenge"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ip-claims/{claim_id}:take:
    post:
      tags: [endpoints]
      operationId: takeIpClaim
      summary: Prove a claim with the evidence the nodes saw
      description: |
        `no_proof` is a 200: a wrong code is counted by the database. Errors: `ip_unavailable`, `ip_suspended`,
        `needs_admin_approval`, `validation_failed` (`exists` on `/cidr`).
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ClaimId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimTakeRequest"}
      responses:
        "200":
          description: The claim and what the proof came to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClaimTake"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/ip-claims/{claim_id}:release:
    post:
      tags: [endpoints]
      operationId: releaseIpClaim
      summary: Give an address up
      description: |
        A claim that was a Plain DNS identity takes its devices' filtering away, so the lock passwords may be needed. Charged to
        `ip-claim` too. Errors: `ip_suspended`, `profile_locked`, `invalid_credentials`, `too_many_attempts`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-rate-also: ip-claim
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ClaimId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LockPasswordsBody"}
      responses:
        "204": {description: Released.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/resolvers:
    get:
      tags: [endpoints]
      operationId: getEndpointResolvers
      summary: The values to set a device up with
      description: |
        The Resolver view of one Endpoint and, with `client`, of one of its clients (P3 8.1): the host, the DoH URL, the Legacy
        DNS addresses, the bootstrap addresses and the DNS Stamps. It carries the DoH token. While no domain or no pair is set
        `ready` is false and `reason` says which.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ClientLabel"}
      responses:
        "200":
          description: The view.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResolverView"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/generators:
    get:
      tags: [endpoints]
      operationId: getEndpointGenerator
      summary: One generated setup text
      description: |
        The output of one generator of the registry (P3 8.2) as `text/plain`: Windows commands, a Firefox or a Chromium policy, the
        Android Private DNS host, the addresses for a router or a TV. The text carries the DoH token. Errors: `not_found` for a
        generator that is not in the registry, `setup_unavailable` while no domain or no pair is set.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: generator
          in: query
          required: true
          description: The id of a generator of the registry, such as `windows-doh`, `firefox-policy`, `chromium-policy`, `android-private-dns` or `address-list`.
          schema: {type: string, minLength: 1, maxLength: 32, pattern: '^[a-z][a-z0-9-]*$', x-ctrlz-rowref: false}
        - {$ref: "#/components/parameters/ClientLabel"}
      responses:
        "200":
          description: The text, as `text/plain`.
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/share-links:
    get:
      tags: [endpoints]
      operationId: listShareLinks
      summary: The share links of an Endpoint, newest first
      description: The value of a link is shown once, when it is made, and never again.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareLinkList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [endpoints]
      operationId: createShareLink
      summary: Make a share link
      description: |
        At most ten live links an Endpoint. Errors: `validation_failed` (`max_share_links_per_endpoint` exceeded, `out_of_range`
        on `ttl_hours`), `setup_unavailable`, `service_unavailable`.
      x-ctrlz-auth: session
      x-ctrlz-rate: link-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ShareLinkCreate"}
      responses:
        "201":
          description: The link, with the URL shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareLinkCreated"}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/share-links/{sid}:
    delete:
      tags: [endpoints]
      operationId: revokeShareLink
      summary: Revoke a share link
      description: The download links made through it end with it.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/ShareId"}
      responses:
        "204": {description: Revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /endpoints/{id}/apple-profile:
    post:
      tags: [endpoints]
      operationId: createAppleProfile
      summary: Make a link to an Apple DNS profile
      description: |
        The link lives 15 minutes and opens three times; the folder and the common domains are expanded now and the profile is
        built from the Endpoint's values when it is downloaded. At most twenty live links a tenant. Errors: `not_found` for a
        folder that is not the tenant's, `validation_failed` (`invalid`, `exceeded`, `max_download_links_per_tenant`),
        `setup_unavailable`, `service_unavailable`.
      x-ctrlz-auth: session
      x-ctrlz-rate: link-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppleProfileRequest"}
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppleLink"}
        default: {$ref: "#/components/responses/Problem"}
  /public/share:
    post:
      tags: [public]
      operationId: openShare
      summary: Open a share link
      description: |
        Spends one use. A value that is junk, unknown, expired, revoked, used up, of a deleted Endpoint or of a tenant that is not
        active is the same `404 not_found`. While no domain or no pair is set the answer is `409 setup_unavailable` and no use is
        spent. The value is in the body and never in a query.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: public-link
      x-ctrlz-max-body: 256
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LinkValue"}
      responses:
        "200":
          description: What the link shows.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShareView"}
        default: {$ref: "#/components/responses/Problem"}
  /public/share/apple-profile:
    post:
      tags: [public]
      operationId: createShareAppleProfile
      summary: Make an Apple profile link through a share link
      description: |
        Spends one use of the share link. `params.client` is absent or the link's own when the link has a client. The new link
        is bounded by the share link's uses. Errors: `not_found`, `validation_failed`, `setup_unavailable`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: public-link
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ShareAppleRequest"}
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppleLink"}
        default: {$ref: "#/components/responses/Problem"}
  /public/apple-profile/{link}:
    get:
      tags: [public]
      operationId: downloadAppleProfile
      summary: Download an Apple DNS profile
      description: |
        Spends one use and builds the profile from the Endpoint's values of the moment, `application/x-apple-aspen-config`,
        as an attachment with an ASCII file name. Nothing is stored. A link preview that fetches the URL counts as a download.
        Every refusal is the same `404 not_found`; `setup_unavailable` while no domain or no pair is set.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: public-link
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - name: link
          in: path
          required: true
          schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{64}$', example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA, x-ctrlz-rowref: false}
      responses:
        "200":
          description: The profile, as `application/x-apple-aspen-config`.
        default: {$ref: "#/components/responses/Problem"}
  /api-tokens:
    get:
      tags: [account]
      operationId: listApiTokens
      summary: The user's API tokens, newest first
      description: |
        Never the value. A token past `expires_at` is expired, and one with `ended` was ended by a change of the password or the
        phone number or by Forgot Password (the second factor and the passkeys keep it); both stay until the user deletes them.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiTokenList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [account]
      operationId: createApiToken
      summary: Make an API token
      description: |
        Needs a reauth window. The value is in the answer once and nowhere else. The token lives 365 days and is for `read` or `write`
        for good: its kind cannot be changed. `allowed_ips` limits where it may be used from, at most 32 addresses or subnets, empty
        for anywhere. A day budget of the tenant bounds how many a tenant makes (`rate_limited`). Errors: `reauth_required`,
        `session_expired` (a credential changed while the request ran), `validation_failed` (`max_api_tokens` exceeded,
        `/allowed_ips/<i>` `invalid`, `exceeded`), `service_unavailable`.
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-rate-also: token-create
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiTokenCreate"}
      responses:
        "201":
          description: The token and its value, shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiTokenCreated"}
        default: {$ref: "#/components/responses/Problem"}
  /api-tokens/{tid}:
    patch:
      tags: [account]
      operationId: patchApiToken
      summary: Rename a token or change where it may be used from
      description: |
        Needs a reauth window. Only `name` and `allowed_ips` change; an empty `allowed_ips` is anywhere. Errors:
        `reauth_required`, `validation_failed`.
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/ApiTokenId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApiTokenPatch"}
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApiToken"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [account]
      operationId: deleteApiToken
      summary: Delete a token
      description: The value stops working at once. The screen asks for a confirmation first.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/ApiTokenId"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /feedback:
    post:
      tags: [account]
      operationId: createFeedback
      summary: Send a feature request or a message to us
      description: |
        The "Request Feature and Contact" dialog of the logo menu (T-125). `kind` is `feature` or `contact`; `body` is a message of at most 4000
        characters. A tenant may send 20 a day, from all its sessions together (`rate_limited`, charged to the `feedback` class too). The
        message is read in the admin console; nothing is answered here. An API token cannot call it. Errors: `validation_failed`,
        `rate_limited`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-rate-also: feedback
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackCreate"}
      responses:
        "201": {description: Received.}
        default: {$ref: "#/components/responses/Problem"}
  /public/free-dns:
    get:
      tags: [public]
      operationId: getPublicFreeDns
      summary: Whether free DNS is on, and the addresses to type (p4-nodes 9.3, Plan T-556)
      description: |
        Read by the browser of the page without a login (T-558) and by the Endpoint page and wizard (T-557). `enabled` is the
        switch; `primary_dns_ip` and `fallback_dns_ip` are the advertised addresses of the active nodes of the global pair, each
        absent while there is no global pair or that node is not active. No tenant data and no client address is in it. The
        answer is cached for 5 seconds in the api and for 30 seconds by the browser.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: public-free-dns
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: The switch and the addresses.
          headers:
            Cache-Control:
              description: 'public, max-age=30'
              required: true
              schema: {type: string, maxLength: 32, enum: ["public, max-age=30"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicFreeDns"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-ctrlz_session
    apiToken:
      type: http
      scheme: bearer
      description: A `read` or `write` token. `read` tokens cannot call a mutating route.
  parameters:
    ApiTokenId:
      name: tid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    ClientLabel:
      name: client
      in: query
      required: false
      description: A client label of the Endpoint (SC 3.1). Without it the view is the Endpoint's own.
      schema: {type: string, minLength: 1, maxLength: 36, pattern: '^[a-z0-9]([a-z0-9-]{0,34}[a-z0-9])?$', x-ctrlz-rowref: false}
    ShareId:
      name: sid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    Ticket:
      name: X-Ctrlz-Ticket
      in: header
      required: true
      description: The ticket a begin route returned.
      schema: {type: string, minLength: 1, maxLength: 4096, pattern: *b64url, x-ctrlz-rowref: true}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Take it from `next_cursor`; a value that does not decode is `bad_request`.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: *b64url, x-ctrlz-rowref: true}
    RuleCursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Take it from `next_cursor`; a value that does not decode, or an empty one, is `bad_request`. Longer than Cursor because a pattern-sort position carries the rule key (up to 347 bytes), so the longest form is 7+1+347+1+36+1+36 = 429 bytes, 572 characters.
      schema: {type: string, minLength: 1, maxLength: 600, pattern: '^[A-Za-z0-9_-]+$', x-ctrlz-rowref: true}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    FolderId:
      name: folder_id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    RuleId:
      name: rule_id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    FilterId:
      name: filter_id
      in: path
      required: true
      schema: {type: string, maxLength: 64, pattern: '^[a-z][a-z0-9-]*$', x-ctrlz-rowref: false}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$', x-ctrlz-rowref: false}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 64 characters of `A-Z a-z 0-9 _ -`. A replay with the same request gives the same answer and no second effect; the same key with another request is `idempotency_key_reused`.
      schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', x-ctrlz-rowref: false}
    ListCursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Take it from `next_cursor`; a value that does not decode, or was made for another list order, is `bad_request`. Longer than Cursor because the position of an alphabetical page carries the name.
      schema: {type: string, minLength: 1, maxLength: 600, pattern: '^[A-Za-z0-9_-]+$', x-ctrlz-rowref: true}
    GroupId:
      name: gid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    ClientId:
      name: cid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    DdnsHostId:
      name: hid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    AuthorizedId:
      name: aid
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
  requestBodies:
    LoginPassword:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginPasswordRequest"}
    WebAuthnResponse:
      required: true
      description: The credential JSON exactly as the browser produced it.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebAuthnResponse"}
  responses:
    SessionExpired:
      description: No session, or it is revoked or past its idle or absolute limit (`session_expired`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: |
        `csrf_rejected`, `password_change_required`, `reauth_required` or `account_suspended`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: '`rate_limited`, with `Retry-After`.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer, minimum: 0, maximum: 86400}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: '`service_unavailable`: the database could not be reached.'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Problem:
      description: |
        An error of spec 14.3. The status and `code` are the pair of that table;
        the codes an operation can raise are in its description. `Retry-After`
        accompanies 429 and 503 answers that have a wait.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer, minimum: 0, maximum: 86400}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LoginResult:
      description: |
        `authenticated` (the session cookies are set), `mfa_required` (finish with
        `/auth/login/totp`) or `passkey_required` (finish with a Passkey).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginResult"}
    OtpIssued:
      description: A challenge exists. Whether a message was sent is not said.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OtpIssued"}
    SessionOtpIssued:
      description: A challenge exists for the signed-in user's own number.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SessionOtpIssued"}
    PasskeyCeremony:
      description: The ticket to send back and the options for the browser.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PasskeyCeremony"}
    Me:
      description: The signed-in user.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Me"}
    SessionsEnded:
      description: Done. New cookies are set.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SessionsEnded"}
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 64
          pattern: *word
          description: A stable machine-readable code. The message is localised by the client.
        request_id:
          type: string
          maxLength: 64
          pattern: *b64url
        retry_after_s:
          type: integer
          minimum: 0
          maximum: 86400
        fields:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, code]
            properties:
              name: {type: string, maxLength: 64, pattern: '^(?:[a-z][a-z0-9_.-]*|(?:/(?:[a-z][a-z0-9_]*|[0-9]{1,5}))*)$'}
              code: {type: string, maxLength: 64, pattern: *word}
    Empty:
      type: object
      additionalProperties: false
    WebAuthnResponse:
      type: object
      additionalProperties: false
      description: |
        The credential JSON as the browser produced it, for an attestation (add a
        passkey) or an assertion (sign in). The server hands the bytes to the WebAuthn
        library untouched, so the schema bounds every member the browser can send and the
        pipeline refuses anything outside it before the library parses a byte. The
        members of the two shapes are all here and only the ones that apply are present.
        Three members name a row and are marked x-ctrlz-rowref true: id and rawId (the
        library finds the credential by rawId, and requires id to equal it) and userHandle
        (the route compares it with the user id of the stored credential), so the
        isolation harness asks for a Cross call that carries another tenant's value in each.
      required: [id, rawId, type, response]
      x-go-type: json.RawMessage
      properties:
        id: {type: string, minLength: 1, maxLength: 1400, pattern: *b64url, x-ctrlz-rowref: true}
        rawId: {type: string, minLength: 1, maxLength: 1400, pattern: *b64url, x-ctrlz-rowref: true}
        type: {type: string, maxLength: 16, enum: [public-key]}
        authenticatorAttachment: {type: [string, "null"], maxLength: 16, pattern: *word, x-ctrlz-rowref: false}
        response:
          type: object
          additionalProperties: false
          required: [clientDataJSON]
          properties:
            clientDataJSON: {type: string, minLength: 1, maxLength: 4096, pattern: *b64url, x-ctrlz-rowref: false}
            attestationObject: {type: string, minLength: 1, maxLength: 24576, pattern: *b64url, x-ctrlz-rowref: false}
            authenticatorData: {type: string, minLength: 1, maxLength: 8192, pattern: *b64url, x-ctrlz-rowref: false}
            publicKey: {type: [string, "null"], maxLength: 2048, pattern: *b64url, x-ctrlz-rowref: false}
            publicKeyAlgorithm: {type: integer, minimum: -65536, maximum: 65536}
            signature: {type: string, minLength: 1, maxLength: 2048, pattern: *b64url, x-ctrlz-rowref: false}
            userHandle: {type: [string, "null"], maxLength: 256, pattern: *b64url, x-ctrlz-rowref: true}
            transports:
              type: array
              maxItems: 16
              items: {type: string, maxLength: 24, pattern: *word, x-ctrlz-rowref: false}
        clientExtensionResults:
          type: object
          maxProperties: 8
          patternProperties:
            '^[a-z][a-zA-Z0-9]{0,31}$':
              type: object
              maxProperties: 8
              patternProperties:
                '^[a-z][a-zA-Z0-9]{0,31}$': {type: [boolean, integer, string], minimum: -2147483648, maximum: 2147483647, minLength: 1, maxLength: 2048, pattern: *content, x-ctrlz-rowref: false}
              additionalProperties: false
          additionalProperties: false
    PublicConfig:
      type: object
      required: [registration_mode, sms_available, passkey_enabled]
      properties:
        registration_mode:
          type: string
          maxLength: 8
          enum: [closed, invite, open]
        sms_available:
          type: boolean
        passkey_enabled:
          type: boolean
    PublicFreeDns:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        primary_dns_ip: {type: string, minLength: 2, maxLength: 45, pattern: '^[0-9A-Fa-f:.]+$'}
        fallback_dns_ip: {type: string, minLength: 2, maxLength: 45, pattern: '^[0-9A-Fa-f:.]+$'}
    LoginPasswordRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone: {type: string, minLength: 1, maxLength: 64, pattern: *pastedcontent}
        password: {type: string, maxLength: 2048, pattern: *prose}
        remember_me: {type: boolean}
    OtpRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        phone: {type: string, minLength: 1, maxLength: 64, pattern: *pastedcontent}
        purpose:
          type: string
          maxLength: 8
          enum: [login, signup, reset, invite]
        locale:
          type: string
          maxLength: 2
          enum: [fa, en]
        invite_token: {type: string, minLength: 1, maxLength: 200, pattern: *pastedcontent}
    OtpIssued:
      type: object
      required: [challenge_id, expires_in_s, resend_after_s]
      properties:
        challenge_id: {type: string, minLength: 64, maxLength: 64, pattern: *b64url}
        expires_in_s: {type: integer, minimum: 0, maximum: 86400}
        resend_after_s: {type: integer, minimum: 0, maximum: 86400}
    SessionOtpIssued:
      type: object
      required: [challenge_id, expires_in_s, resend_after_s]
      properties:
        challenge_id: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
        expires_in_s: {type: integer, minimum: 0, maximum: 86400}
        resend_after_s: {type: integer, minimum: 0, maximum: 86400}
    LoginOtpRequest:
      type: object
      additionalProperties: false
      required: [phone, challenge_id, code]
      properties:
        phone: {type: string, minLength: 1, maxLength: 64, pattern: *pastedcontent}
        challenge_id: {type: string, minLength: 64, maxLength: 64, pattern: *b64url}
