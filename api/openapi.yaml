  /profiles/{id}/folders/{folder_id}/export:
    get:
      tags: [profiles]
      operationId: exportFolderRules
      summary: Export Rules of a folder as a rules document
      description: 'Errors: `server_busy` when the process has no room to build the document now; the tenant may retry.'
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/FolderId"}
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RulesDocument"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/folders/{folder_id}:upload:
    post:
      tags: [profiles]
      operationId: uploadFolderRules
      summary: Upload Folder, merging a rules document into a folder
      description: |
        Never deletes. A key that lives in another folder is a `conflict`. Above 1,000 rules the request is a job and
        answers 202. Errors: `profile_locked`, `validation_failed`, `idempotency_key_reused`, `job_running`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      x-ctrlz-max-body: 6291456
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/FolderId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
