          application/json:
            schema: {$ref: "#/components/schemas/ServicesBatch"}
      responses:
        "200":
          description: What each slug came to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchResult"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/folders:
