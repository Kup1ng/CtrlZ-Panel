openapi: 3.1.0
info:
  title: Ctrl Z Panel API
  version: 0.2.0-p1
  summary: The tenant API. Every route of spec 14.2 is here; later phases add the rest of the product's routes.
  description: |
    The tenant API (`ctrlz api`, database role `ctrlz_tenant`). The admin API
    (`ctrlz admin`) has its own hostname and its own document, `admin-openapi.yaml`.

    Two ways to authenticate, both resolved before the tenant is known and then
    scoped to one tenant for the whole request (`store.WithTenant`):

    - a session cookie named `__Host-ctrlz_session` (opaque value, only a hash is stored);
    - a bearer API token, `read` or `write`, optionally limited to Allowed IPs (P3, refused on every P1 route).

    No route takes a tenant id. Every route acts on the `(tenant, user)` of the
    session, so another tenant's row and a missing row are both `404 not_found`.

    Every refusal that could reveal another tenant's data (a taken prefix, a
    taken phone number, an unknown token) returns the same generic error.

    Every operation outside the `health` tag carries two extensions that the
    router and a test read (`internal/apispec`):

    - `x-ctrlz-auth`: `none`, `session`, `session-setup` (also while the
      session is restricted by a one-time password) or `reauth` (a reauth in the
      last 10 minutes);
    - `x-ctrlz-rate`: the rate class of spec 14.1.

    A third, optional, `x-ctrlz-max-body`, raises the request body limit above the
    16 KiB default; the passkey finish routes and the bulk routes of P2 use it. An
    operation whose limit is above 64 KiB takes the bulk gate (a byte-weighted pool,
    one tenant's share of it) after its session resolved and before its body is read.

    Every operation also declares three more (P2 spec 8.1): `x-ctrlz-token`
    (`none`, `read` or `write`: what an API token may do, enforced from P3),
    `x-ctrlz-lock` (`none`, `guard`, `lock` or `unlock`: how it meets the lock of a
    profile) and `x-ctrlz-outbox` (`none`, `profile` or `profile+endpoint_set`: the
    outbox rows it writes).

    Errors are `Error` bodies. The codes of spec 14.3 are listed on each
    operation's `default` response; the HTTP status is the one of that table.
servers:
  - url: /api/v1
    description: Behind the Panel hostname, through the front door.
tags:
  - name: health
    description: Liveness and readiness. Not versioned, not authenticated, outside the request pipeline.
  - name: auth
    description: Sessions, login, refresh, registration and Forgot Password.
  - name: account
    description: The signed-in user's own account.
  - name: notifications
    description: The bell and the announcement banners.
  - name: profiles
    description: Profiles, their filters, services, rules, folders and options, documents, the lock, and the batch jobs.
# The alphabets of the string schemas below, written once so the two documents and
# every field agree (rule boundary-input, spec 14.2). Each pattern is anchored and
# excludes the control, format and private-use characters; internal/lint judges them
# by what they accept, not by how they are written. They are RE2 (Go) patterns, which
# is what the request validator runs.
x-ctrlz-patterns:
  text: &text '^[^\p{C}]*$'
  # A typed code or a phone number: `text` plus the paste marks (format characters, tab, line feed,
  # carriage return) that the fold of internal/auth/digits drops, so a code pasted from a
  # right-to-left editor reaches the handler instead of being refused here. The text is
  # digits.PastePattern; TestPastePatternIsThePasteMarkClass holds the two together (round 14,
  # primitives-r14-3). The fields that use it are the lint's list (codeFields).
  pasted: &pasted '^(?:[^\p{C}]|\p{Cf}|[\t\n\r])*$'
  # An identifier or a value the server keys on: its first character is not a control, format or
  # separator character, so an empty value and a blank one are refused by the schema and never reach a keyed
  # step (tenant-r18-3; the same patterns as api/admin-openapi.yaml). `pastedcontent` is `pasted` for a typed
  # code, phone or token that must be there (digits.PasteContentPattern).
  content: &content '^[^\p{C}\p{Z}][^\p{C}]*$'
  pastedcontent: &pastedcontent '^(?:\p{Cf}|\p{Z}|[\t\n\r])*[^\p{C}\p{Z}](?:[^\p{C}]|\p{Cf}|[\t\n\r])*$'
  # Persian prose keeps the zero width non-joiner (U+200C), which the language needs
  # inside words. Only fields that carry prose use it, and the lint holds that list.
  prose: &prose '^(?:[^\p{C}]|\x{200C})*$'
  # A name, a comment or a message of the profile routes (P2): prose, and it starts with a character that is not blank (the lint
  # asks every request string to refuse the empty and the blank value).
  nameprose: &nameprose '^(?:[^\s\p{C}])(?:[^\p{C}]|\x{200C})*$'
  nametext: &nametext '^[^\s\p{C}][^\p{C}]*$'

  # `prose` for a value that must be there (the name of a passkey): the first character is not a control,
  # format or separator character, so an empty or blank name is refused, except that a half-space (U+200C)
  # may lead: the server drops it and refuses what is left when nothing is, with a 422 of the handler
  # (primitives-r18-3 together with tenant-r18-3).
  prosecontent: &prosecontent '^(?:[^\p{C}\p{Z}]|\x{200C})(?:[^\p{C}]|\x{200C})*$'
  uuid: &uuid '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
  datetime: &datetime '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]{8,16}(Z|[+-][0-9]{2}:[0-9]{2})$'
  date: &date '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  b64url: &b64url '^[A-Za-z0-9_-]*$'
  word: &word '^[a-z][a-z0-9_.-]*$'
  key: &key '^[A-Za-z][A-Za-z0-9_.-]*$'
  host: &host '^[A-Za-z0-9.-]*$'
  alpha2: &alpha2 '^[A-Za-z]{2}$'
  base32: &base32 '^[A-Z2-7]*$'
paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness
      security: []
      servers:
        - url: /
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, role, version]
                properties:
                  status: {type: string, const: ok, maxLength: 2}
                  role: {type: string, maxLength: 32, pattern: '^[a-z]+$'}
                  version: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._+~-]*$'}
  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness
      description: |
        Succeeds when the database answers for this role. Answered to a loopback peer only (the
        container healthcheck); any other peer gets the 404 of an unknown path, so a neighbour cannot
        spend the role's database pool through it (admin-r11-4).
      security: []
      servers:
        - url: /
      responses:
        "200": {description: Ready.}
        "503": {description: The database is unavailable.}
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: What the login page needs before anyone is signed in
      description: |
        The registration mode, whether an SMS can be sent and whether Passkey is
        on. It holds no user data and is cached for 30 seconds.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: public-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: The public configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/login/password:
    post:
      tags: [auth]
      operationId: loginPassword
      summary: Sign in with a phone number and a password
      description: |
        Inside a 500 ms floor. A known and an unknown phone take the same path
        and run Argon2 once. Errors: `invalid_credentials`, `too_many_attempts`,
        `account_suspended`, `server_busy`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody: {$ref: "#/components/requestBodies/LoginPassword"}
      responses:
        "200": {$ref: "#/components/responses/LoginResult"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a code by SMS for login, signup, Forgot Password or an invite
      description: |
        Inside a 300 ms floor. A phone with no account gets the same 202 as one
        with an account (a decoy challenge). Errors: `otp_limited`,
        `registration_closed`, `invite_invalid`, `invalid_phone`, `sms_unavailable`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: otp-send
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OtpRequest"}
      responses:
        "202": {$ref: "#/components/responses/OtpIssued"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/login/otp:
    post:
      tags: [auth]
      operationId: loginOtp
      summary: Sign in with a code sent by SMS
      description: 'Errors: `otp_invalid`, `otp_expired`, `otp_locked`, `too_many_attempts`, `account_suspended`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginOtpRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginResult"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/login/totp:
    post:
      tags: [auth]
      operationId: loginTotp
      summary: Finish a login with a TOTP code or a recovery code
      description: 'The ticket comes from `mfa_required`. Errors: `ticket_invalid`, `totp_invalid`, `totp_step_reused`, `too_many_attempts`, `conflict`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginTotpRequest"}
      responses:
        "200": {$ref: "#/components/responses/LoginResult"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/passkey/login/begin:
    post:
      tags: [auth]
      operationId: passkeyLoginBegin
      summary: Start a discoverable Passkey login
      description: 'Errors: `passkey_unavailable`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyLoginBeginRequest"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyCeremony"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/passkey/login/finish:
    post:
      tags: [auth]
      operationId: passkeyLoginFinish
      summary: Finish a Passkey login with the browser's assertion
      description: |
        The ticket is in the `X-Ctrlz-Ticket` header and the body is the
        browser's assertion JSON, untouched. Inside a 200 ms floor. Errors:
        `passkey_invalid`, `ticket_invalid`, `passkey_unavailable`, `account_suspended`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Ticket"}
      requestBody: {$ref: "#/components/requestBodies/WebAuthnResponse"}
      responses:
        "200": {$ref: "#/components/responses/LoginResult"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renew the session from the refresh cookie
      description: |
        Reads `__Host-ctrlz_refresh` (Remember me). On success it rotates the
        refresh token and the session token and answers 204 with both cookies.
        A concurrent tab that loses the race inside the 10 second grace gets 204
        with no cookies and retries. A refresh token used again after the grace
        ends its whole family and the session. Errors: `session_expired`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "204": {description: Renewed, or already renewed by a concurrent request.}
        "401": {$ref: "#/components/responses/SessionExpired"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End this session
      description: Also works while the account is suspended and while the session is restricted.
      x-ctrlz-auth: session-setup
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "204": {description: Signed out. Both cookies are cleared.}
        "401": {$ref: "#/components/responses/SessionExpired"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: End every session of this user, this one included
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "204": {description: All sessions ended. Both cookies are cleared.}
        "401": {$ref: "#/components/responses/SessionExpired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /auth/reauth:
    post:
      tags: [auth]
      operationId: reauth
      summary: Prove the current factors again and open a ten minute reauth window
      description: |
        What must be sent depends on what the user has (spec 3.5): the password,
        the password and a TOTP or recovery code, a TOTP or recovery code alone,
        or, for a user with neither, a code from `/auth/reauth/otp/request`. SMS
        never satisfies a user who has a password or TOTP. The session token is
        rotated and both cookies are set. Errors: `invalid_credentials`,
        `totp_invalid`, `totp_step_reused`, `otp_invalid`, `otp_expired`,
        `otp_locked`, `too_many_attempts`, `conflict` (a credential moved while the
        request ran: start again), `server_busy` (the Argon2 gate was full; nothing was
        counted against the user).
      x-ctrlz-auth: session-setup
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReauthRequest"}
      responses:
        "204": {description: The reauth window is open. New cookies are set.}
        default: {$ref: "#/components/responses/Problem"}
  /auth/reauth/otp/request:
    post:
      tags: [auth]
      operationId: reauthOtpRequest
      summary: Send a reauth code to the signed-in user's own number
      description: |
        Takes no body and no phone. Answers `409 conflict` when the user has a
        password or TOTP, so it never sends a code that could not be used.
        Errors: `otp_limited`, `sms_unavailable`, `conflict`.
      x-ctrlz-auth: session-setup
      x-ctrlz-rate: otp-send-user
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "202": {$ref: "#/components/responses/SessionOtpIssued"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/reauth/passkey/begin:
    post:
      tags: [auth]
      operationId: reauthPasskeyBegin
      summary: Start a Passkey assertion for the signed-in user
      description: 'Errors: `passkey_unavailable`, `passkey_invalid`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200": {$ref: "#/components/responses/PasskeyCeremony"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/reauth/passkey/finish:
    post:
      tags: [auth]
      operationId: reauthPasskeyFinish
      summary: Finish a Passkey reauth
      description: 'Errors: `passkey_invalid`, `ticket_invalid`, `too_many_attempts`. Inside a 200 ms floor.'
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Ticket"}
      requestBody: {$ref: "#/components/requestBodies/WebAuthnResponse"}
      responses:
        "204": {description: The reauth window is open. New cookies are set.}
        default: {$ref: "#/components/responses/Problem"}
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account with an SMS code, in open mode or with an invite
      description: |
        The password is optional; without it the account is OTP-only. A weak
        password is refused before the code is spent. Errors: `otp_invalid`,
        `otp_expired`, `otp_locked`, `password_weak`, `registration_closed`,
        `invite_invalid`, `too_many_attempts`, `conflict` (the number was taken while
        the request ran), `server_busy` (the Argon2 or scoring gate was full; the code
        was not spent and the network count of the check is given back).
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201": {$ref: "#/components/responses/LoginResult"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/invites/lookup:
    post:
      tags: [auth]
      operationId: lookupInvite
      summary: Read an invite code, for the invite page
      description: 'Unknown, used, revoked and expired invites are all `404 invite_invalid`. Errors: `invite_invalid`, `too_many_attempts`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InviteLookupRequest"}
      responses:
        "200":
          description: The invite is valid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InviteInfo"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/password/reset/verify:
    post:
      tags: [auth]
      operationId: resetVerify
      summary: Check the Forgot Password code and say what else is needed
      description: 'Errors: `otp_invalid`, `otp_expired`, `otp_locked`, `too_many_attempts`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResetVerifyRequest"}
      responses:
        "200":
          description: The code was right. The ticket is good for five minutes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResetVerified"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/password/reset/passkey/begin:
    post:
      tags: [auth]
      operationId: resetPasskeyBegin
      summary: Start the Passkey proof of Forgot Password
      description: 'Errors: `ticket_invalid`, `passkey_unavailable`.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TicketOnly"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyCeremony"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/password/reset/passkey/finish:
    post:
      tags: [auth]
      operationId: resetPasskeyFinish
      summary: Finish the Passkey proof of Forgot Password
      description: 'Returns a new reset ticket that records the proof. Errors: `passkey_invalid`, `ticket_invalid`, `too_many_attempts`. Inside a 200 ms floor.'
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Ticket"}
      requestBody: {$ref: "#/components/requestBodies/WebAuthnResponse"}
      responses:
        "200":
          description: The proof was accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TicketOnly"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/password/reset/complete:
    post:
      tags: [auth]
      operationId: resetComplete
      summary: Set a new password
      description: |
        Needs the second factor `ResetVerified.second_factor` named. With a
        Passkey that is out of reach, `defer_enforce` starts the 72 hour delay
        after which Enforce Passkey counts as off. Every session of the user ends.
        Errors: `ticket_invalid`, `password_weak`, `totp_invalid`,
        `totp_step_reused`, `passkey_invalid`, `too_many_attempts`, `conflict`,
        `server_busy`.
      security: []
      x-ctrlz-auth: none
      x-ctrlz-rate: auth
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResetCompleteRequest"}
      responses:
        "204": {description: The password is set. The user signs in normally.}
        default: {$ref: "#/components/responses/Problem"}
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The shell's bootstrap
      description: Works while the session is restricted and while the tenant is suspended.
      x-ctrlz-auth: session-setup
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200": {$ref: "#/components/responses/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /account/preferences:
    patch:
      tags: [account]
      operationId: updatePreferences
      summary: Language, theme and the onboarding checklist
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreferencesRequest"}
      responses:
        "200": {$ref: "#/components/responses/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /account/home-countries:
    put:
      tags: [account]
      operationId: setHomeCountries
      summary: Replace the Home Countries (at most three)
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HomeCountries"}
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HomeCountries"}
        default: {$ref: "#/components/responses/Problem"}
  /account/limits:
    get:
      tags: [account]
      operationId: getLimits
      summary: The quotas in force, read only
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: One number per quota.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Limits"}
        default: {$ref: "#/components/responses/Problem"}
  /account/sessions:
    get:
      tags: [account]
      operationId: listSessions
      summary: The user's live sessions
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        default: {$ref: "#/components/responses/Problem"}
  /account/sessions/{id}:
    delete:
      tags: [account]
      operationId: deleteSession
      summary: End another session
      description: |
        A session created before this one can be ended with no more proof. A
        newer one needs a live reauth window (`reauth_required`), so a thief
        cannot throw the owner out. The current session is `validation_failed`:
        use logout. Errors: `reauth_required`, `validation_failed`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: Ended.}
        default: {$ref: "#/components/responses/Problem"}
  /account/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Set a new password
      description: |
        Needs a reauth window, except for a session opened by the live one-time
        password (it just proved knowledge of it). Inside a fresh reauth window no
        code is asked, because that window already proved the second factor. Only
        in the excepted case, outside a fresh window, and when the user has TOTP,
        `totp_code` is required. Rotates this session and ends the others and the
        API tokens. Errors: `password_weak`, `totp_invalid`, `totp_step_reused`,
        `too_many_attempts`, `reauth_required`, `session_expired`, `conflict` (a
        credential moved while the request ran: start again), `server_busy`.
      x-ctrlz-auth: session-setup
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "204": {description: Changed. New cookies are set.}
        default: {$ref: "#/components/responses/Problem"}
  /account/phone/change:
    post:
      tags: [account]
      operationId: startPhoneChange
      summary: Start a phone change; a code goes to both numbers
      description: 'Errors: `otp_limited`, `invalid_phone`, `sms_unavailable`, `validation_failed` (same number).'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: otp-send-user
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneChangeRequest"}
      responses:
        "202":
          description: Both codes are on their way.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PhoneChange"}
        default: {$ref: "#/components/responses/Problem"}
  /account/phone/change/{id}/confirm:
    post:
      tags: [account]
      operationId: confirmPhoneChange
      summary: Finish a phone change with both codes
      description: 'Errors: `otp_invalid` (with `fields` naming `old_code` or `new_code`), `phone_unavailable`, `too_many_attempts`, `not_found`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PhoneConfirmRequest"}
      responses:
        "204": {description: The number changed. New cookies are set and the other sessions ended.}
        default: {$ref: "#/components/responses/Problem"}
  /account/totp/setup:
    post:
      tags: [account]
      operationId: totpSetup
      summary: Make a TOTP secret, not yet enabled
      description: 'Errors: `totp_already_enabled`.'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "200":
          description: The secret, shown once, and the otpauth URI for the QR code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetup"}
        default: {$ref: "#/components/responses/Problem"}
  /account/totp/confirm:
    post:
      tags: [account]
      operationId: totpConfirm
      summary: Prove the app has the secret and turn TOTP on
      description: 'Errors: `totp_invalid`, `totp_step_reused`, `totp_not_pending`, `too_many_attempts`, `conflict`, `validation_failed` (`saved` must be true).'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200":
          description: TOTP is on. The recovery codes are shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpEnabled"}
        default: {$ref: "#/components/responses/Problem"}
  /account/totp/disable:
    post:
      tags: [account]
      operationId: totpDisable
      summary: Turn TOTP off
      description: 'Errors: `totp_not_enabled`.'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "200": {$ref: "#/components/responses/SessionsEnded"}
        default: {$ref: "#/components/responses/Problem"}
  /account/totp/recovery-codes:
    post:
      tags: [account]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      description: 'Errors: `totp_not_enabled`.'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "200":
          description: The new codes, shown once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecoveryCodes"}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkeys:
    get:
      tags: [account]
      operationId: listPasskeys
      summary: The user's passkeys, stale ones included
      description: 'Errors: `passkey_unavailable`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyList"}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkeys/begin:
    post:
      tags: [account]
      operationId: passkeyBegin
      summary: Start adding a passkey
      description: 'Errors: `passkey_unavailable`, `validation_failed` (too many passkeys).'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "200": {$ref: "#/components/responses/PasskeyCeremony"}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkeys/finish:
    post:
      tags: [account]
      operationId: passkeyFinish
      summary: Finish adding a passkey with the browser's attestation
      description: |
        The ticket is in the `X-Ctrlz-Ticket` header and the body is the
        browser's attestation JSON, untouched. The chosen name is set afterwards
        with PATCH. Errors: `passkey_invalid`, `ticket_invalid`.
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      x-ctrlz-max-body: 65536
      parameters:
        - {$ref: "#/components/parameters/Ticket"}
      requestBody: {$ref: "#/components/requestBodies/WebAuthnResponse"}
      responses:
        "201":
          description: Added. New cookies are set and the other sessions ended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyAdded"}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkeys/review:
    post:
      tags: [account]
      operationId: reviewPasskeys
      summary: Confirm the passkey list after a recovery
      description: 'Errors: `passkey_unavailable`.'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "204": {description: The review flag is cleared.}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkeys/{id}:
    patch:
      tags: [account]
      operationId: renamePasskey
      summary: Rename a passkey
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RenamePasskeyRequest"}
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyRow"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [account]
      operationId: deletePasskey
      summary: Delete a passkey
      description: Deleting the last live passkey turns Enforce Passkey off.
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /account/passkey-enforcement:
    put:
      tags: [account]
      operationId: setPasskeyEnforcement
      summary: Turn Enforce Passkey on or off
      description: 'Errors: `enforce_precondition_failed`.'
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EnforcementRequest"}
      responses:
        "200": {$ref: "#/components/responses/SessionsEnded"}
        default: {$ref: "#/components/responses/Problem"}
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The bell
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Newest first. `unread_count` counts every row, not one page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPage"}
        default: {$ref: "#/components/responses/Problem"}
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: readNotification
      summary: Mark a notification read
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: Marked.}
        default: {$ref: "#/components/responses/Problem"}
  /announcements:
    get:
      tags: [notifications]
      operationId: listAnnouncements
      summary: The announcements addressed to this tenant
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Newest first. `unread_count` counts every row, not one page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementPage"}
        default: {$ref: "#/components/responses/Problem"}
  /announcements/{id}/read:
    post:
      tags: [notifications]
      operationId: readAnnouncement
      summary: Mark an announcement read
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: none
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: Marked.}
        default: {$ref: "#/components/responses/Problem"}
  /catalog/filters:
    get:
      tags: [profiles]
      operationId: listCatalogFilters
      summary: The 20 Native and 12 3rd Party filters with their modes
      description: |
        Names in both languages, the state of each filter and, for a filter with several modes, its modes in wire order
        with the default marked. A filter with one mode lists none. Enabling or changing the mode of New Domains is
        subject to the `.ir` warning of D45: the same sentence is in the filter's explanation.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: Every filter.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogFilterList"}
        default: {$ref: "#/components/responses/Problem"}
  /catalog/services:
    get:
      tags: [profiles]
      operationId: listCatalogServices
      summary: The service categories and the services of the catalog
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: Every category and service.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogServiceList"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: The tenant's profiles with their counters
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileList"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Create a profile from one of the seven types
      description: 'Errors: `validation_failed` (the name, the kind, `max_profiles` exceeded).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileCreate"}
      responses:
        "201":
          description: Created. `flagged` counts the destinations of the type the profile cannot use yet.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileCreated"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles:import:
    post:
      tags: [profiles]
      operationId: importProfile
      summary: Import a profile document
      description: |
        The body carries the file as base64, at most 4 MiB before encoding, so the handler can explain every
        problem (`validation_failed` with JSON pointers). Above 1,000 rules the request is a job and answers 202.
        Errors: `validation_failed`, `idempotency_key_reused`, `job_running`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: profile
      x-ctrlz-max-body: 6291456
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DocumentUpload"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileCreated"}
        "202":
          description: Queued as a job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}:
    get:
      tags: [profiles]
      operationId: getProfile
      summary: One profile
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [profiles]
      operationId: renameProfile
      summary: Rename a profile
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileRename"}
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete an unlocked profile
      description: 'Errors: `profile_locked`, `profile_in_use` (an Endpoint or a schedule window uses it).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile+endpoint_set
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}:duplicate:
    post:
      tags: [profiles]
      operationId: duplicateProfile
      summary: Duplicate a profile under a new name
      description: |
        Export of the source followed by Import of that document. The copy is unlocked; a locked profile can be
        duplicated. Above 1,000 rules the request is a job and answers 202.
        Errors: `validation_failed`, `idempotency_key_reused`, `job_running`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: write
      x-ctrlz-lock: none
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileDuplicate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileCreated"}
        "202":
          description: Queued as a job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/export:
    get:
      tags: [profiles]
      operationId: exportProfile
      summary: The profile as a document, in canonical form
      description: 'Errors: `server_busy` when the process has no room to build the document now; the tenant may retry.'
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The document. The same profile gives the same bytes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileDocument"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/disabled:
    put:
      tags: [profiles]
      operationId: disableProfile
      summary: Disable a profile for a while or until a moment
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileDisable"}
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [profiles]
      operationId: enableProfile
      summary: Switch a disabled profile back on
      description: 'Errors: `profile_locked`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/lock:
    post:
      tags: [profiles]
      operationId: lockProfile
      summary: Lock a profile with a password of its own
      description: |
        Needs a live reauth: a lock outlives the session that set it. The password is the profile's own, 6 to 128
        code points after NFKC. Errors: `reauth_required`, `conflict` (already locked), `too_many_attempts`,
        `validation_failed`, `server_busy`.
      x-ctrlz-auth: reauth
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: lock
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileLock"}
      responses:
        "204": {description: Locked.}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/unlock:
    post:
      tags: [profiles]
      operationId: unlockProfile
      summary: Unlock a profile with its password
      description: |
        Errors: `invalid_credentials`, `too_many_attempts` (with `Retry-After`), `conflict` (a relock came between),
        `validation_failed`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: sensitive
      x-ctrlz-token: none
      x-ctrlz-lock: unlock
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileUnlock"}
      responses:
        "204": {description: Unlocked.}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/locations:
    get:
      tags: [profiles]
      operationId: getProfileLocations
      summary: The locations the profile may use, optionally limited to some services
      description: 'Errors: `validation_failed` (an unknown slug, or more than 100).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: services
          in: query
          required: false
          description: Comma separated slugs, at most 100.
          schema: {type: string, minLength: 1, maxLength: 7000, pattern: '^[a-z0-9,-]*$', x-ctrlz-rowref: false}
      responses:
        "200":
          description: The set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LocationSet"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/filters:
    get:
      tags: [profiles]
      operationId: listProfileFilters
      summary: The filters the profile has switched on or off
      description: |
        Enabling or changing the mode of New Domains shows the `.ir` warning of D45 in the panel: a name under `.ir` is
        never reached through a proxy, so the warning stands beside the filter.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The filters of the profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileFilterList"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/filters/{filter_id}:
    put:
      tags: [profiles]
      operationId: setProfileFilter
      summary: Switch a filter on or off and choose its mode
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
