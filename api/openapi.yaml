        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Folder"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/folders/{folder_id}:
    patch:
      tags: [profiles]
      operationId: updateFolder
      summary: Edit a folder
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/FolderId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FolderPatch"}
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Folder"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [profiles]
      operationId: deleteFolder
      summary: Delete a folder and the rules in it
