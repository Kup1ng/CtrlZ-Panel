        content:
          application/json:
            schema: {$ref: "#/components/schemas/RulesUpload"}
      responses:
        "200":
          description: What each rule came to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchResult"}
        "202":
          description: Queued as a job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/rules:
    get:
      tags: [profiles]
      operationId: listRules
      summary: One page of the profile's rules
      description: |
        `folder` is a folder id or `root`; `q` is lowered, split on dots and matched as a substring of the rule key, a
        label with a non-ASCII letter by its A-label; `sort` is `pattern`, `created` or `updated`.
        Errors: `server_busy` when the page is large and the tenant already holds its share of answers that clients have not read yet; retry.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - name: folder
          in: query
          required: false
          schema: {type: string, maxLength: 36, pattern: '^(root|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$', x-ctrlz-rowref: true}
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 253, pattern: *pasted, x-ctrlz-rowref: false}
        - name: status
          in: query
          required: false
          schema: {type: string, maxLength: 8, enum: [enabled, disabled, expired]}
        - name: action
          in: query
          required: false
          schema: {type: string, maxLength: 8, enum: [block, bypass, redirect, inherit]}
        - name: sort
          in: query
          required: false
          schema: {type: string, maxLength: 8, enum: [pattern, created, updated], default: pattern}
        - {$ref: "#/components/parameters/RuleCursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RulePage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [profiles]
      operationId: createRules
      summary: Create rules, one per pattern
      description: |
        All or none. At most 1,000 patterns, so it always runs inline. Errors: `profile_locked`, `validation_failed`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
      x-ctrlz-max-body: 1048576
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RulesCreate"}
      responses:
        "201":
          description: The new rules.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RuleList"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/rules/{rule_id}:
    patch:
      tags: [profiles]
      operationId: updateRule
      summary: Edit one rule
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/RuleId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RulePatch"}
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Rule"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [profiles]
      operationId: deleteRule
      summary: Delete one rule
      description: 'Errors: `profile_locked`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/RuleId"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/rules/{rule_id}:transfer:
    post:
      tags: [profiles]
      operationId: transferRule
      summary: Copy or move one rule
      description: 'The batch semantics for one id. Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/RuleId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuleTransfer"}
      responses:
        "200":
          description: What the rule came to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchResult"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/rules:batch:
    post:
      tags: [profiles]
      operationId: batchRules
      summary: Copy, move, edit, enable, disable or delete a selection of rules
      description: |
        `ids` or a `selector`, exactly one. Above 1,000 rules the request is a job and answers 202. Errors:
        `profile_locked`, `validation_failed`, `idempotency_key_reused`, `job_running`, `server_busy`.
      x-ctrlz-auth: session
      x-ctrlz-rate: bulk-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      x-ctrlz-max-body: 1048576
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RulesBatch"}
      responses:
        "200":
          description: What each item came to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchResult"}
        "202":
          description: Queued as a job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/options:
    get:
      tags: [profiles]
      operationId: getOptions
      summary: The options of the profile
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The options that are set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Options"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [profiles]
      operationId: patchOptions
      summary: Set or clear options
      description: 'Errors: `profile_locked`, `validation_failed`.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OptionsPatch"}
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Options"}
        default: {$ref: "#/components/responses/Problem"}
  /jobs/active:
    get:
      tags: [profiles]
      operationId: getActiveJob
      summary: The tenant's queued or running job, if any
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      responses:
        "200":
          description: The job, or none.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActiveJob"}
        default: {$ref: "#/components/responses/Problem"}
  /jobs/{id}:
    get:
      tags: [profiles]
      operationId: getJob
      summary: One job
      description: 'Errors: `server_busy` when the answer of a finished job is large and the tenant already holds its share of answers that clients have not read yet; retry.'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-ctrlz_session
    apiToken:
      type: http
      scheme: bearer
      description: A `read` or `write` token. `read` tokens cannot call a mutating route.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    Ticket:
      name: X-Ctrlz-Ticket
      in: header
      required: true
      description: The ticket a begin route returned.
      schema: {type: string, minLength: 1, maxLength: 4096, pattern: *b64url, x-ctrlz-rowref: true}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Take it from `next_cursor`; a value that does not decode is `bad_request`.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: *b64url, x-ctrlz-rowref: true}
    RuleCursor:
      name: cursor
      in: query
      required: false
      description: Opaque. Take it from `next_cursor`; a value that does not decode, or an empty one, is `bad_request`. Longer than Cursor because a pattern-sort position carries the rule key (up to 347 bytes), so the longest form is 7+1+347+1+36+1+36 = 429 bytes, 572 characters.
      schema: {type: string, minLength: 1, maxLength: 600, pattern: '^[A-Za-z0-9_-]+$', x-ctrlz-rowref: true}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    FolderId:
      name: folder_id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    RuleId:
      name: rule_id
      in: path
      required: true
      schema: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
    FilterId:
      name: filter_id
      in: path
      required: true
      schema: {type: string, maxLength: 64, pattern: '^[a-z][a-z0-9-]*$', x-ctrlz-rowref: false}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$', x-ctrlz-rowref: false}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 64 characters of `A-Z a-z 0-9 _ -`. A replay with the same request gives the same answer and no second effect; the same key with another request is `idempotency_key_reused`.
      schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$', x-ctrlz-rowref: false}
  requestBodies:
    LoginPassword:
      required: true
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginPasswordRequest"}
    WebAuthnResponse:
      required: true
      description: The credential JSON exactly as the browser produced it.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/WebAuthnResponse"}
  responses:
    SessionExpired:
      description: No session, or it is revoked or past its idle or absolute limit (`session_expired`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: |
        `csrf_rejected`, `password_change_required`, `reauth_required` or `account_suspended`.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: '`rate_limited`, with `Retry-After`.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer, minimum: 0, maximum: 86400}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: '`service_unavailable`: the database could not be reached.'
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Problem:
      description: |
        An error of spec 14.3. The status and `code` are the pair of that table;
        the codes an operation can raise are in its description. `Retry-After`
        accompanies 429 and 503 answers that have a wait.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: {type: integer, minimum: 0, maximum: 86400}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    LoginResult:
      description: |
        `authenticated` (the session cookies are set), `mfa_required` (finish with
        `/auth/login/totp`) or `passkey_required` (finish with a Passkey).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LoginResult"}
    OtpIssued:
      description: A challenge exists. Whether a message was sent is not said.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OtpIssued"}
    SessionOtpIssued:
      description: A challenge exists for the signed-in user's own number.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SessionOtpIssued"}
    PasskeyCeremony:
      description: The ticket to send back and the options for the browser.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PasskeyCeremony"}
    Me:
      description: The signed-in user.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Me"}
    SessionsEnded:
      description: Done. New cookies are set.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SessionsEnded"}
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 64
          pattern: *word
          description: A stable machine-readable code. The message is localised by the client.
        request_id:
          type: string
          maxLength: 64
          pattern: *b64url
        retry_after_s:
          type: integer
          minimum: 0
          maximum: 86400
        fields:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name, code]
            properties:
              name: {type: string, maxLength: 64, pattern: '^(?:[a-z][a-z0-9_.-]*|(?:/(?:[a-z][a-z0-9_]*|[0-9]{1,5}))*)$'}
              code: {type: string, maxLength: 64, pattern: *word}
    Empty:
      type: object
      additionalProperties: false
    WebAuthnResponse:
      type: object
      additionalProperties: false
      description: |
        The credential JSON as the browser produced it, for an attestation (add a
        passkey) or an assertion (sign in). The server hands the bytes to the WebAuthn
        library untouched, so the schema bounds every member the browser can send and the
        pipeline refuses anything outside it before the library parses a byte. The
        members of the two shapes are all here and only the ones that apply are present.
