      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
      parameters:
        - {$ref: "#/components/parameters/Id"}
        - {$ref: "#/components/parameters/Slug"}
