  /profiles/{id}/services:batch:
    post:
      tags: [profiles]
      operationId: batchProfileServices
      summary: Set or remove several services at once
      description: |
        `op: set` upserts each slug with the given state (Choose Service Add, the group actions), `op: delete` removes
        them. At most 2,000 slugs, so it always runs inline. Errors: `profile_locked`, `validation_failed`, `server_busy`.
