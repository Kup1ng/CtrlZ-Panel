      x-ctrlz-rate: user-read
      x-ctrlz-token: read
      x-ctrlz-lock: none
      x-ctrlz-outbox: none
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: The services of the profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileServiceList"}
        default: {$ref: "#/components/responses/Problem"}
  /profiles/{id}/services/{slug}:
    put:
      tags: [profiles]
      operationId: setProfileService
      summary: Set the state of one service
      description: 'Errors: `profile_locked`, `validation_failed` (`iranian_name` for a Redirect on a service that is never proxied).'
      x-ctrlz-auth: session
      x-ctrlz-rate: user-write
      x-ctrlz-token: write
      x-ctrlz-lock: guard
      x-ctrlz-outbox: profile
