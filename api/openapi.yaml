        bypass_ttl: {type: integer, minimum: 1, maximum: 86400}
        block_response: {$ref: "#/components/schemas/BlockResponseOption"}
        ecs: {$ref: "#/components/schemas/ECSOption"}
        dns64: {type: boolean}
        cname_flattening: {type: boolean}
        safe_search: {type: boolean}
        restricted_youtube: {type: boolean}
    ProfileDocument:
      type: object
      additionalProperties: false
      description: |
        Profile document, version 1 (spec 6.1). The content of a profile and nothing of its identity. A location is
        named by its key, a folder by a `ref` local to the document. The type of a profile (spec 5) is such a document
        without `name`.
      required: [format, version, kind]
      properties:
        format: {type: string, maxLength: 32, pattern: '^[a-z][a-z-]*$'}
        version: {type: integer, minimum: 1, maximum: 1000}
        name: {type: string, minLength: 1, maxLength: 64, pattern: *nameprose}
        kind: {type: string, maxLength: 16, enum: [custom, developer, gaming, kids, privacy, productivity, vpn_replacement]}
        filters:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/DocFilter"}
        services:
          type: array
          maxItems: 5000
          items: {$ref: "#/components/schemas/DocService"}
        folders:
          type: array
          maxItems: 500
          items: {$ref: "#/components/schemas/DocFolder"}
        rules:
          type: array
          maxItems: 10000
          items: {$ref: "#/components/schemas/DocRule"}
        options: {$ref: "#/components/schemas/DocOptions"}
    RulesDocument:
      type: object
      additionalProperties: false
      description: Rules document, version 1 (spec 6.3), the file of Export Rules and Upload Folder.
      required: [format, version, rules]
      properties:
        format: {type: string, maxLength: 32, pattern: '^[a-z][a-z-]*$'}
        version: {type: integer, minimum: 1, maximum: 1000}
        rules:
          type: array
          maxItems: 10000
          items: {$ref: "#/components/schemas/RulesDocumentRule"}
security:
  - session: []
  - apiToken: []
