      maxProperties: 32
      patternProperties:
        '^[A-Za-z][A-Za-z0-9_.-]{0,63}$': {type: [string, integer, boolean], minimum: -2147483648, maximum: 2147483647, minLength: 1, maxLength: 256, pattern: *content, x-ctrlz-rowref: false}
