  /profiles/{id}/rules:
    get:
      description: |
        `folder` is a folder id or `root`; `q` is lowered, split on dots and matched as a substring of the rule key, a
        label with a non-ASCII letter by its A-label; `sort` is `pattern`, `created` or `updated`.
        Errors: `server_busy` when the page is large and the tenant already holds its share of answers that clients have not read yet; retry.
      operationId: listRules
      parameters:
        - $ref: '#/components/parameters/Id'
        - in: query
          name: folder
          required: false
          schema:
            maxLength: 36
            pattern: ^(root|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
            type: string
        - in: query
          name: q
          required: false
          schema:
            maxLength: 253
            pattern: ^(?:[^\p{C}]|\p{Cf}|[\t\n\r])*$
            type: string
        - in: query
          name: status
          required: false
          schema:
            enum:
              - enabled
              - disabled
              - expired
            maxLength: 8
            type: string
        - in: query
          name: action
          required: false
          schema:
            enum:
              - block
              - bypass
              - redirect
              - inherit
            maxLength: 8
            type: string
        - in: query
          name: sort
          required: false
          schema:
            default: pattern
            enum:
              - pattern
              - created
              - updated
            maxLength: 8
            type: string
        - $ref: '#/components/parameters/RuleCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
          description: A page.
        default:
          $ref: '#/components/responses/Problem'
      security:
        - apiToken: []
      summary: One page of the profile's rules
      tags:
        - custom-rules
      x-ctrlz-token: read
    post:
      description: |
        All or none. At most 1,000 patterns, so it always runs inline. Errors: `profile_locked`, `validation_failed`, `server_busy`.
      operationId: createRules
      parameters:
        - $ref: '#/components/parameters/Id'
