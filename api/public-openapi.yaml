        type: string
    IdempotencyKey:
      description: 1 to 64 characters of `A-Z a-z 0-9 _ -`. A replay with the same request gives the same answer and no second effect; the same key with another request is `idempotency_key_reused`.
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 64
        minLength: 1
        pattern: ^[A-Za-z0-9_-]+$
