            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
          description: The new rules.
        default:
          $ref: '#/components/responses/Problem'
      security:
        - apiToken: []
      summary: Create rules, one per pattern
      tags:
        - custom-rules
      x-ctrlz-token: write
