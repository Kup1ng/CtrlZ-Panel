        maximum: 100
        minimum: 1
        type: integer
    ListCursor:
      description: Opaque. Take it from `next_cursor`; a value that does not decode, or was made for another list order, is `bad_request`. Longer than Cursor because the position of an alphabetical page carries the name.
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 600
        minLength: 1
        pattern: ^[A-Za-z0-9_-]+$
        type: string
    RuleCursor:
      description: Opaque. Take it from `next_cursor`; a value that does not decode, or an empty one, is `bad_request`. Longer than Cursor because a pattern-sort position carries the rule key (up to 347 bytes), so the longest form is 7+1+347+1+36+1+36 = 429 bytes, 572 characters.
