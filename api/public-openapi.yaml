          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        dest_profile_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        dest_root:
          type: boolean
        ids:
          items:
            format: uuid
            maxLength: 36
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            type: string
          maxItems: 10000
          type: array
        new_folder:
          $ref: '#/components/schemas/NewFolder'
        op:
          enum:
            - copy
            - move
            - edit
            - enable
            - disable
            - delete
          maxLength: 8
          type: string
        selector:
          $ref: '#/components/schemas/RuleSelector'
        set:
          $ref: '#/components/schemas/RuleEditSet'
      required:
        - op
      type: object
    RulesCreate:
      additionalProperties: false
      properties:
        action:
          enum:
            - block
            - bypass
            - redirect
            - inherit
          maxLength: 8
          type: string
        comment:
          maxLength: 64
          minLength: 1
          pattern: ^(?:[^\s\p{C}])(?:[^\p{C}]|\x{200C})*$
          type: string
        enabled:
          type: boolean
        expires_at:
          format: date-time
          maxLength: 40
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]{8,16}(Z|[+-][0-9]{2}:[0-9]{2})$
          type: string
        expires_in:
          enum:
            - 1h
            - 1d
            - 1w
            - 1m
          maxLength: 2
          type: string
        folder_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        patterns:
          items:
            maxLength: 260
            minLength: 1
            pattern: ^[^\s\p{C}][^\p{C}]*$
            type: string
          maxItems: 1000
          minItems: 1
          type: array
        target:
          $ref: '#/components/schemas/Target'
      required:
        - patterns
        - action
      type: object
    RulesDocument:
      additionalProperties: false
      description: Rules document, version 1 (spec 6.3), the file of Export Rules and Upload Folder.
      properties:
        format:
          maxLength: 32
          pattern: ^[a-z][a-z-]*$
          type: string
        rules:
          items:
            $ref: '#/components/schemas/RulesDocumentRule'
          maxItems: 10000
          type: array
        version:
          maximum: 1000
          minimum: 1
          type: integer
      required:
        - format
        - version
        - rules
      type: object
    RulesDocumentRule:
      additionalProperties: false
      description: A rule of a rules document (spec 6.3), the rule item of a profile document without `folder`, since every rule goes into the folder of the path.
      properties:
        action:
          enum:
            - block
            - bypass
            - redirect
            - inherit
          maxLength: 8
          type: string
        comment:
          maxLength: 64
          minLength: 1
          pattern: ^(?:[^\s\p{C}])(?:[^\p{C}]|\x{200C})*$
          type: string
        enabled:
          type: boolean
        expires_at:
          format: date-time
          maxLength: 40
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]{8,16}(Z|[+-][0-9]{2}:[0-9]{2})$
          type: string
        pattern:
          maxLength: 260
          minLength: 1
          pattern: ^[^\s\p{C}][^\p{C}]*$
          type: string
        target:
          $ref: '#/components/schemas/DocTarget'
      required:
        - pattern
        - action
      type: object
    RulesUpload:
      additionalProperties: false
      description: The rules document as base64, at most 4 MiB before encoding, and how it is merged into the folder (`new_only` by default).
      properties:
        document:
          maxLength: 5592420
          minLength: 1
          pattern: ^[A-Za-z0-9+/]*={0,2}$
          type: string
        mode:
          enum:
            - new_only
            - upsert
          maxLength: 8
          type: string
      required:
        - document
      type: object
    Schedule:
      properties:
        timezone:
          maxLength: 64
          pattern: ^[A-Za-z][A-Za-z0-9_+/-]*$
          type: string
        windows:
          items:
            $ref: '#/components/schemas/ScheduleWindow'
          maxItems: 64
          type: array
      required:
        - timezone
        - windows
      type: object
    SchedulePut:
      additionalProperties: false
      properties:
        confirm_destinations:
          type: boolean
        lock_passwords:
          $ref: '#/components/schemas/LockPasswords'
        timezone:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9_+/-]*$
          type: string
        windows:
          items:
            $ref: '#/components/schemas/ScheduleWindowIn'
          maxItems: 128
          type: array
      required:
        - timezone
        - windows
      type: object
    ScheduleWindow:
      properties:
        end:
          maximum: 10080
          minimum: 30
          type: integer
        id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        profile_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        profile2_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        start:
          maximum: 10050
          minimum: 0
          type: integer
      required:
        - id
        - start
        - end
        - profile_id
      type: object
    ScheduleWindowIn:
      additionalProperties: false
      properties:
        end:
          maximum: 10080
          minimum: 0
          type: integer
        id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        profile_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        profile2_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        start:
          maximum: 10080
          minimum: 0
          type: integer
      required:
        - start
        - end
        - profile_id
      type: object
    ServicesBatch:
      additionalProperties: false
      properties:
        action:
          enum:
            - block
            - bypass
            - redirect
          maxLength: 8
          type: string
        enabled:
          type: boolean
        op:
          enum:
            - set
            - delete
          maxLength: 8
          type: string
        slugs:
          items:
            maxLength: 64
            minLength: 1
            pattern: ^[a-z0-9][a-z0-9-]*$
            type: string
          maxItems: 2000
          minItems: 1
          type: array
        target:
          $ref: '#/components/schemas/Target'
      required:
        - op
        - slugs
      type: object
    StampOfAddress:
      properties:
        ip:
          $ref: '#/components/schemas/IpAddress'
        stamp:
          maxLength: 2048
          pattern: ^sdns://[A-Za-z0-9_-]*$
          type: string
      required:
        - ip
        - stamp
      type: object
    Target:
      additionalProperties: false
      description: |
        Where a Redirect goes. A request names a location by `location_id`; `location` is in responses only, read by
        id, so a row whose location left the set can still be shown.
      properties:
        host:
          maxLength: 255
          minLength: 1
          pattern: ^[^\s\p{C}][^\p{C}]*$
          type: string
        ipv4:
          maxLength: 15
          minLength: 1
          pattern: ^[0-9.]*$
          type: string
        ipv6:
          maxLength: 45
          minLength: 1
          pattern: ^[0-9A-Fa-f:.]*$
          type: string
        kind:
          enum:
            - location
            - auto
            - random
            - ip
            - host
          maxLength: 8
          type: string
        location:
          $ref: '#/components/schemas/LocationKey'
        location_id:
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
      required:
        - kind
      type: object
    TimezoneList:
      properties:
        zones:
          items:
            maxLength: 64
            pattern: ^[A-Za-z][A-Za-z0-9_+/-]*$
            type: string
          maxItems: 1000
          type: array
      required:
        - zones
      type: object
  securitySchemes:
    apiToken:
      description: An API token, `ctz_` and 64 characters.
      scheme: bearer
      type: http
