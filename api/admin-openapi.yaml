        panel_host: {type: string, minLength: 1, maxLength: 253, pattern: *host}
        admin_host: {type: string, minLength: 1, maxLength: 253, pattern: *host}
        transition_days: {type: integer, minimum: 1, maximum: 90, default: 30}
