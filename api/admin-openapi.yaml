      type: object
      required: [endpoints, apple_profiles]
      properties:
        endpoints: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        apple_profiles: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
    CertificateView:
      type: object
      required: [id, kind, source, state, names, not_before, not_after, created_at]
      properties:
        id: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
        kind: {type: string, maxLength: 20, enum: [wildcard, panel, admin, node_ca, zone_ca, block_root, block_intermediate]}
        source: {type: string, maxLength: 8, enum: [issued, uploaded]}
        state: {type: string, maxLength: 8, enum: [pending, active, retired, revoked]}
        names:
          type: array
          maxItems: 16
          items: {type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9*.-]+$'}
        not_before: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        not_after: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        created_at: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
    CertificatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/CertificateView"}
        next_cursor: {type: string, maxLength: 128, pattern: *b64url}
    UploadCertificateRequest:
      type: object
      additionalProperties: false
      required: [kind, chain_pem, key_pem]
      properties:
        kind: {type: string, maxLength: 8, enum: [wildcard, panel, admin]}
        # The examples satisfy the pattern and are not a certificate or a key: the boundary lint sends one as the baseline of the
        # request, and the route answers it with cert_invalid.
        chain_pem: {type: string, minLength: 64, maxLength: 32768, pattern: *pem, example: "-----BEGIN EXAMPLE-----\nQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU2Nzg5\n-----END EXAMPLE-----"}
        key_pem: {type: string, minLength: 64, maxLength: 8192, pattern: *pem, example: "-----BEGIN EXAMPLE-----\nQUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU2Nzg5\n-----END EXAMPLE-----"}
    CertificateCreated:
      type: object
      required: [id, names, not_after]
      properties:
        id: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
        names:
          type: array
          maxItems: 16
          items: {type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9*.-]+$'}
        not_after: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
security:
  - admin: []
