    NodeView:
      type: object
      description: |
        What the database holds of a node and of its latest Heartbeat. The parts that live only in the memory
        of the hub (the failover conditions, the drain state and a revocation still pending) are not here until
        the hub writes them (p4-nodes 5.3 to 5.6).
      required: [id, slot, name, status, resolve_mode, proxy_blocked, created_at, applied_seq, config_head, applied_seq_lag, dns_withdrawn, dns_hold, pending_requests]
      properties:
        id: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
        slot: {type: integer, minimum: 1, maximum: 4}
        name: {type: string, maxLength: 64, pattern: *content}
        status: {type: string, maxLength: 8, enum: [pending, active, revoked]}
        resolve_mode: {type: string, maxLength: 16, enum: [recursive, upstream, mixed]}
        proxy_blocked: {type: boolean}
        dns_bind_ip: {type: string, maxLength: 45, pattern: *ip}
        dns_advertised_ip: {type: string, maxLength: 45, pattern: *ip}
        proxy_bind_ip: {type: string, maxLength: 45, pattern: *ip}
        proxy_advertised_ip: {type: string, maxLength: 45, pattern: *ip}
        key_fingerprint: {type: string, maxLength: 64, pattern: *hex}
        created_at: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        last_heartbeat_at: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        node_version: {type: string, maxLength: 64, pattern: *text}
        unbound_version: {type: string, maxLength: 64, pattern: *text}
        catalog_version: {type: string, maxLength: 64, pattern: *text}
        blob_major_max: {type: integer, minimum: 0, maximum: 65535}
        isolated: {type: boolean}
        quarantined: {type: integer, minimum: 0, maximum: 2147483647}
        qps: {type: integer, minimum: 0, maximum: 2147483647}
        cache_hit_permille: {type: integer, minimum: 0, maximum: 1000}
        applied_seq: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        config_head: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        applied_seq_lag: {type: integer, format: int64, minimum: 0, maximum: 9007199254740991}
        dns_withdrawn: {type: boolean}
        dns_hold: {type: boolean}
        dns_last_failback_at: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        dns_flap_until: {type: string, format: date-time, maxLength: 40, pattern: *datetime}
        pair_peer_id: {type: string, format: uuid, maxLength: 36, pattern: *uuid}
        pending_requests: {type: integer, minimum: 0, maximum: 2147483647}
