# chrony on the panel host: the one time source of every node (p4-nodes 7.10, T-087).
#
# Install: copy to /etc/chrony/chrony.conf (or `include` it) on the PANEL HOST. chrony is a host service; Compose publishes
# nothing for it. The firewall opens UDP 123 and TCP 4460 to the node addresses and to nothing else (T-412).

# 1. Upstream time. The panel host takes its own time from internal NTP sources the operator names, one `server <host> iburst`
#    line per file under this directory; chrony reads only files whose name ends in .sources (for example node-a.sources),
#    and ignores any other name. Nothing here reaches the international internet (Plan.md rule 9), so no pool is
#    listed: a host with no source falls back to the local clock below and the nodes still agree with each other.
sourcedir /etc/chrony/ctrlz-sources.d

# 2. With no upstream source reachable, this host serves its own clock at stratum 10 so the nodes stay together. `orphan`
#    makes it yield to any other orphan with a lower reference id, so two panel hosts do not each lead.
local stratum 10 orphan

# 3. Who may ask. `allow` lines for the node addresses ONLY (dns_advertised_ip of each node, one /32 or /128 each), in files under
#    this directory, one `allow <address>` line per file; chrony reads only files whose name ends in .conf (for example
#    node-a.conf), and ignores any other name, which leaves that node unserved. chrony denies every client until an allow line
#    names it, so a host whose node was removed from the panel stops being served when its line is deleted.
confdir /etc/chrony/ctrlz-nodes.d

# 4. NTS-KE (TCP 4460) and NTP (UDP 123) for the nodes. The leaf is the hub's: five years, signed by the node CA, serverAuth only,
#    written by the hub into deploy/chrony/nts/ when it is missing or a third of its life is left, with an alert to RESTART chrony,
#    which reads these two files only at start. Adjust the path to where this checkout lives. The key is 0640 and the hub
#    replaces it with a new file at each renewal. A grant made on the file (chgrp, or an ACL entry) is lost with the old file, and the
#    hub in its container belongs to no group but its own, so it cannot hand the key to a group chrony belongs to. The one route that
#    survives a renewal is a DEFAULT ACL on the directory, which every new file inherits:
#      setfacl -m u:_chrony:rx deploy/chrony/nts ; setfacl -d -m u:_chrony:r deploy/chrony/nts ; setfacl -m u:_chrony:r deploy/chrony/nts/nts.key
#    The hub logs a warning when a renewed key lost a group. Check after a renewal that chrony can still read nts.key.
ntsservercert /opt/ctrlz/deploy/chrony/nts/nts.crt
ntsserverkey /opt/ctrlz/deploy/chrony/nts/nts.key
ntsport 4460
ntsprocesses 1
ntsdumpdir /var/lib/chrony

# 5. The usual host settings.
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
# Keeps one misbehaving node from spending this host's CPU on NTP.
ratelimit interval 1 burst 16 leak 2
