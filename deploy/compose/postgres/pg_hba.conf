# Who may connect to the Panel's Postgres, and how.
#
# The superuser is local only, by peer authentication, and exists for the
# installer and for backups (spec section 2). It is never reachable from the
# Compose network. Every service role uses SCRAM with its own Docker secret.
# "samenet" matches the Compose backend network and nothing else.

# TYPE  DATABASE  USER                                                                           ADDRESS   METHOD
local   all       postgres                                                                                 peer
local   all       all                                                                                      reject
host    all       postgres                                                                       all       reject
host    ctrlz     ctrlz_tenant,ctrlz_hub,ctrlz_compiler,ctrlz_worker,ctrlz_admin                samenet    scram-sha-256
# The migrator owns every table and can undo FORCE ROW LEVEL SECURITY or
# SET ROLE ctrlz_auth, so it is not a role every container may log in as: only
# the address of the one-shot migrate container (docker-compose.yml) may.
host    ctrlz     ctrlz_migrator                                                                 10.213.77.200/32 scram-sha-256
# The key tool (`rekey` and `declare-lost` of user_totp) can switch off a second
# factor, so it is let in from the address of its one-shot container only, like
# the migrator (docker-compose.yml, service rekey).
host    ctrlz     ctrlz_keytool                                                                  10.213.77.201/32 scram-sha-256
host    all       all                                                                            all       reject
