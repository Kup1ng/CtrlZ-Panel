# Fixed settings of the Panel's Postgres. Memory and connection numbers are
# not here: they come from the Compose profile (profiles/*.env) as -c flags on
# the command line, which override this file.

listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'

# Passwords are stored and checked as SCRAM only.
password_encryption = 'scram-sha-256'

# Row level security is the tenant boundary. Statement text and bind values
# can hold a phone number or a token, so neither is ever logged (rule 8).
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
# An ERROR line carries a DETAIL line with the failing row ("Failing row
# contains ...") for a CHECK or unique violation on a table with no row level
# security, which is every global table: phone numbers, OTP hashes, admin
# password hashes, invite token hashes. terse drops DETAIL, HINT, QUERY and
# CONTEXT, so the log keeps the message and the SQLSTATE and nothing from the
# data. log_statement above does not cover this, and a "neither is ever logged"
# claim was false without it (review).
log_error_verbosity = terse
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q'
log_timezone = 'UTC'
timezone = 'UTC'

# JIT only adds latency to the short statements of this service. A singleton
# table that was never analysed is estimated at hundreds of rows, so a one-row
# join such as ctrlz_fn.auth_public_config() crossed jit_above_cost and paid
# 350 to 850 ms of compilation per call, past the 3 s config bound under CPU
# load (a 503 on the first login). The pools also send jit=off at connect
# time (internal/store/store.go), so this line covers every other client.
jit = off

# The data is worth more than the speed: keep fsync on.
fsync = on
synchronous_commit = on
full_page_writes = on

# Night-time autovacuum must keep up with outbox tables that are written and
# drained constantly.
autovacuum = on
autovacuum_naptime = '20s'

# A prepared transaction (PREPARE TRANSACTION) belongs to no backend, so the watchdog, which ends
# backends, cannot end the row locks a login role leaves in one. Zero is the default; it is pinned so
# a changed default or a profile does not turn it on unseen (the migrate step also refuses a server
# where it is not 0).
max_prepared_transactions = 0
