# Auth-role Valkey (R44): session-adjacent counters that must survive a restart.
# The users (one per service) and the memory ceiling are added on the command line by Compose.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Durable to within a second, and never silently drops a key to make room.
appendonly yes
appendfsync everysec
save ""
maxmemory-policy noeviction

# Nothing here ever writes to the log what a client sent.
loglevel warning

# A script that runs this long makes every other command answer BUSY. The maintenance loop of the
# container (maintain.sh) kills it; the services cannot submit one (no EVAL in their ACL).
busy-reply-threshold 2000

# Connections are a resource a service credential must not be able to use up either (admin-r15-1; rule 29).
# Three Go roles and the container's own loop need a few dozen at most; a client that connects and says
# nothing, with or without a password, is closed after two minutes (rueidis redials a closed connection by
# itself, TestLimiterSurvivesTheServerClosingItsIdleConnection). Authentication is the only thing an
# unauthenticated client can do, so it is not a way to keep a slot for longer.
maxclients 512
timeout 120
