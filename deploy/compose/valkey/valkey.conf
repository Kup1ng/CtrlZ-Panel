# Auth-role Valkey (R44): session-adjacent counters that must survive a restart. One server for each trust zone (api, admin).
# The zone's user and the memory ceiling are added by deploy/compose/valkey/start.sh.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Durable to within a second, and never silently drops a key to make room.
appendonly yes
appendfsync everysec
save ""
maxmemory-policy noeviction

# Nothing here ever writes to the log what a client sent.
loglevel warning

# A script that runs this long makes every other command answer BUSY. The maintenance loop of the
# container (maintain.sh) kills it; the services cannot submit one (no EVAL in their ACL).
busy-reply-threshold 2000

# Connections and what a client holds in memory are resources a credential must not be able to use up
# either (admin-r15-1, admin-r16-12; rule 29). The zone's server is reached by one service and the container's
# own loop, so a few dozen connections at most; a client that connects and says nothing is closed after two
# minutes (rueidis redials a closed connection by itself, TestLimiterSurvivesTheServerClosingItsIdleConnection).
maxclients 512
timeout 120

# Client memory counts toward maxmemory, and under noeviction a partial command that a client keeps
# open holds it for as long as the connection lives: the ACL refuses a command only after it was read
# whole, and the idle timeout does not close a client that sends a byte now and then. A bulk argument has
# no use here beyond a key name, a field and a number (the largest thing a service or the loop sends is the
# 8 KB sweep script), so a bulk or a query buffer over 1 MB is refused, and the clients together may hold
# a tenth of maxmemory: past that Valkey closes the largest one, which is the holder.
proto-max-bulk-len 1mb
client-query-buffer-limit 1mb
maxmemory-clients 10%
