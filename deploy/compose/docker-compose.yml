  kek_user_totp:
    file: ${CTRLZ_SECRETS_DIR:-../../secrets}/kek_user_totp
  kek_otp_delivery:
    file: ${CTRLZ_SECRETS_DIR:-../../secrets}/kek_otp_delivery
  kek_auth_mac:
    file: ${CTRLZ_SECRETS_DIR:-../../secrets}/kek_auth_mac
  kek_admin_totp:
    file: ${CTRLZ_SECRETS_DIR:-../../secrets}/kek_admin_totp
  kek_sms_cred:
