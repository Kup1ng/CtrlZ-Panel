# The nightly timing test of the Panel (spec 18.5, "Timing"): a known and an unknown phone must not be told apart by how
# long a failed password login takes. It has a build tag (timing) and so no shard of ci.yml compiles it; this is its job
# (CI review round 13, ci-r13-1; Plan.md D64, ci-unrun-checks).
#
# It runs from the clock on the default branch and by hand, never from a push or a pull request, so it neither slows the
# run that the publisher waits for nor lets anyone but the owner start it. A wall-clock test on a shared runner is
# noisy, and the owner's rule is that a flake is a finding, so the noise is handled where it can be: the test takes the
# median of 500 interleaved samples on each side, and .github/ci/timing.sh runs it again before it reports a failure, and
# fails a run that did not take the samples (see the script). A real leak of 20 ms or more fails both runs.
#
# The same rules as ci.yml: a read-only token, no credential, the two pinned actions, no expression in a script.
name: timing

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timing-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  timing:
    name: timing known and unknown phone
    runs-on: ubuntu-24.04
    # Two attempts of timing.sh, each with a go test timeout of 25 minutes, and the setup (ci-r14-2).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            shared/go.sum
      - name: Check the compiler
        run: sh scripts/go-pin-check.sh
      - name: Note the images of the runner
        run: sh .github/ci/images.sh before
      - name: The timing test
        env:
          CTRLZ_CI: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: sh .github/ci/timing.sh
      - name: Judge the images the test ran against
        run: sh .github/ci/images.sh after
