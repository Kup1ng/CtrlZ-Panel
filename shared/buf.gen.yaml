version: v2
managed:
  enabled: false
plugins:
  # Local plugins on purpose: nothing in this build may need the network at
  # generation time except fetching the pinned plugin versions once.
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
inputs:
  - directory: proto
