// Node enrollment (contract section 12). Server-auth TLS with the panel CA
// pinned and no client certificate: a node has no identity yet. Nothing about
// tenants and no TLS key is sent before admin approval (R19).
syntax = "proto3";

package ctrlz.enroll.v1;

option go_package = "github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/enroll/v1;enrollv1";

enum EnrollState {
  ENROLL_STATE_UNSPECIFIED = 0;
  ENROLL_STATE_PENDING = 1;
  ENROLL_STATE_APPROVED = 2;
  ENROLL_STATE_REJECTED = 3;
}

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Poll(PollRequest) returns (PollResponse);
}

message EnrollRequest {
  string token = 1;
  bytes csr_der = 2;
  string hostname = 3;
  bytes dns_bind_ip = 4;
  bytes dns_advertised_ip = 5;
  bytes proxy_bind_ip = 6;
  bytes proxy_advertised_ip = 7;
  string os_release = 8;
  string node_version = 9;
}

message EnrollResponse {
  bytes enrollment_id = 1;
  string key_fingerprint = 2;
}

message PollRequest {
  bytes enrollment_id = 1;
  bytes proof_sig = 2;
}

message PollResponse {
  EnrollState state = 1;
  bytes node_id = 2;
  bytes client_cert_der = 3;
  repeated bytes ca_chain_der = 4;
}
