// Node to node grant forwarding inside a pair (contract sections 10.3, 10.4, 12).
// mTLS only; the peer SPKI must be in the signed PairTable.
syntax = "proto3";

package ctrlz.peer.v1;

option go_package = "github.com/Kup1ng/CtrlZ-Shared/gen/ctrlz/peer/v1;peerv1";

service PeerNode {
  rpc Forward(stream GrantForward) returns (stream GrantAck);
  rpc Revoke(GrantRevoke) returns (RevokeAck);
}

message GrantForward {
  bytes grant_id = 1;
  bytes endpoint_id = 2;
  bytes source_prefix = 3;
  bytes name_wire = 4;
  uint32 location = 5;
  bytes dial_host_wire = 6;
  uint32 grant_kind = 7;
  int64 expires_at = 8;
  uint64 sender_config_seq = 9;
}

message GrantAck {
  bytes grant_id = 1;
  bool accepted = 2;
}

message GrantRevoke {
  bytes endpoint_id = 1;
  uint64 rev_seq = 2;
}

message RevokeAck {}
